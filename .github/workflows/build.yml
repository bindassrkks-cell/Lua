name: Build, Commit Source & Release Core Native App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26, CMake, Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl coreutils gradle
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # =========================================================================
      # 1. SCAFFOLD COMPLETE PROJECT WITH ALL C/C++ AND KOTLIN SOURCES
      # =========================================================================
      - name: Scaffold Full Source Code
        run: |
          # Clean old files
          rm -rf app/src/main/java app/src/main/cpp content dist staging *.pak
          cat << 'EOF' > .gitignore
          *.iml
          .gradle
          /local.properties
          /.idea/
          .DS_Store
          build/
          */build/
          dist/
          staging/
          .cxx/
          EOF

          # Create directories
          mkdir -p app/src/main/cpp/Sdk
          mkdir -p app/src/main/java/com/islamic/app/ui/theme
          mkdir -p app/src/main/java/com/islamic/app/ui/components
          mkdir -p app/src/main/java/com/islamic/app/ui/screens
          mkdir -p app/src/main/java/com/islamic/app/native
          mkdir -p app/src/main/java/com/islamic/app/prayer
          mkdir -p app/src/main/java/com/islamic/app/downloader
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # ------------------------ C/C++ Sources --------------------------------
          # 2.5 MB payload
          cat << 'EOF' > app/src/main/cpp/payload.S
          .section .rodata
          .globl g_islamic_core_payload
          .type g_islamic_core_payload, %object
          .size g_islamic_core_payload, 2500000
          g_islamic_core_payload:
          .fill 2500000, 1, 0x55
          EOF

          # Main libsos.c – all JNI functions (15+ posts, salah guide, surah list, ayah detail, Gemini)
          cat << 'EOF' > app/src/main/cpp/libsos.c
          #include <jni.h>
          #include <string.h>
          extern const char g_islamic_core_payload[2500000];

