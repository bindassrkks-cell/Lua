name: Muslim Community - Wasm iOS Engine Build

on:
  workflow_dispatch:
    inputs:
      clean_repo:
        description: "Clean repository and regenerate fresh project"
        required: true
        default: true
        type: boolean
      push_project:
        description: "Push generated app and Wasm system to repository"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  COMPILE_SDK: "35"
  TARGET_SDK: "35"
  MIN_SDK: "24"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "26.3.11579264"
  CMAKE_VERSION: "3.22.1"

jobs:
  muslim-community:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. CONFIGURE GIT IDENTITY
      # ============================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 3. CLEAN REPOSITORY WORKSPACE
      # ============================================================
      - name: Clean workspace
        if: ${{ inputs.clean_repo == true }}
        shell: bash
        run: |
          echo "Cleaning repository..."
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          echo "Repository cleaned."

      # ============================================================
      # 4. GENERATE WASM ENGINE, GITHUB JSON & ANDROID APP
      # ============================================================
      - name: Generate Project Files
        shell: bash
        run: |
          python3 - << 'PYEOF'
          import os, json

          # 1. Create Live GitHub Online Feed (wasm/muslim_feed.json)
          feed_data = {
              "repo": "bindassrkks-cell/Lua",
              "version": "3.1.0",
              "last_sync": "2026-09-05",
              "daily_banner": {
                  "arabic": "إِنَّ مَعَ الْعُسْرِ يُسْرًا",
                  "translation": "Indeed, with hardship comes ease.",
                  "surah": "Surah Ash-Sharh (94:6)",
                  "category": "Hope & Relief"
              },
              "ayat_posts": [
                  {
                      "id": 1,
                      "surah_name": "Al-Baqarah",
                      "ayah_no": 153,
                      "tag": "Patience",
                      "arabic": "يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ",
                      "translation": "O you who have believed, seek help through patience and prayer. Indeed, Allah is with the patient.",
                      "tafseer": "Patience (Sabr) coupled with Prayer is the ultimate fortress for a believer against all worldly trials."
                  },
                  {
                      "id": 2,
                      "surah_name": "Ar-Ra'd",
                      "ayah_no": 28,
                      "tag": "Peace of Heart",
                      "arabic": "الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",
                      "translation": "Those who have believed and whose hearts are assured by the remembrance of Allah. Unquestionably, by the remembrance of Allah hearts are assured.",
                      "tafseer": "True contentment is found not in worldly abundance, but in the constant Dhikr of the Almighty."
                  },
                  {
                      "id": 3,
                      "surah_name": "At-Talaq",
                      "ayah_no": 3,
                      "tag": "Trust (Tawakkul)",
                      "arabic": "وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ",
                      "translation": "And will provide for him from where he does not expect. And whoever relies upon Allah - then He is sufficient for him.",
                      "tafseer": "Complete reliance on Allah opens doors of sustenance from means unimaginable to humans."
                  }
              ]
          }

          os.makedirs("wasm", exist_ok=True)
          with open("wasm/muslim_feed.json", "w", encoding="utf-8") as f:
              json.dump(feed_data, f, indent=2, ensure_ascii=False)
          print("Generated wasm/muslim_feed.json for online GitHub sync.")

          # 2. Compile .wasm Binary with packed payload
          os.makedirs("app/src/main/assets", exist_ok=True)
          wasm_header = b'\x00\x61\x73\x6d\x01\x00\x00\x00' # \0asm\1\0\0\0
          feed_bytes = json.dumps(feed_data).encode("utf-8")
          # Custom Section: ID=0, Length, SectionName="muslim_feed", Content=json
          sec_name = b'muslim_feed'
          sec_content = bytes([len(sec_name)]) + sec_name + feed_bytes
          custom_sec = bytes([0x00]) + len(sec_content).to_bytes(2, 'big') + sec_content

          with open("app/src/main/assets/muslim_core.wasm", "wb") as f:
              f.write(wasm_header + custom_sec)
          print("Packed Wasm binary into assets/muslim_core.wasm")

          # 3. Android Source Code Setup
          files = {
              "settings.gradle.kts": """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MuslimCommunity"
          include(":app")
          """.strip(),

              "build.gradle.kts": """
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          """.strip(),

              "gradle.properties": """
          org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableR8.fullMode=true
          android.nonTransitiveRClass=true
          """.strip(),

              "app/proguard-rules.pro": """
          -keepattributes *Annotation*
          -keepclassmembers class * {
              native <methods>;
          }
          -keep class com.muslimcommunity.app.NativeCore { *; }
          -keep class com.muslimcommunity.app.WasmSyncManager { *; }
          """.strip(),

              "app/build.gradle.kts": """
