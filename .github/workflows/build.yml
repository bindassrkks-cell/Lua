          """.strip(),

              "app/src/main/cpp/native-lib.cpp": """
          #include <jni.h>
          #include <string>
          #include <vector>

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_muslimcommunity_app_NativeCore_verifyWasmMagic(JNIEnv* env, jobject, jbyteArray bytes) {
              jsize len = env->GetArrayLength(bytes);
              if (len < 8) return JNI_FALSE;
              std::vector<jbyte> header(8);
              env->GetByteArrayRegion(bytes, 0, 8, header.data());
              // WebAssembly 1.0 Magic: \0asm\1\0\0\0
              if (header[0] == 0x00 && header[1] == 0x61 && header[2] == 0x73 && header[3] == 0x6D &&
                  header[4] == 0x01 && header[5] == 0x00 && header[6] == 0x00 && header[7] == 0x00) {
                  return JNI_TRUE;
              }
              return JNI_FALSE;
          }
          """.strip(),

