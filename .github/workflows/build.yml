        run: |
          # 1.1 Root Gitignore
          cat << 'EOF' > .gitignore
          *.iml
          .gradle
          /local.properties
          /.idea/
          .DS_Store
          build/
          */build/
          dist/
          staging/
          .cxx/
          EOF

          # 1.2 Remove any legacy PAK files
          rm -rf content dist staging *.pak app/src/main/java/com/islamic/app/pak

          # 1.3 Create C++ Directory Structure
          mkdir -p app/src/main/cpp/Sdk

          # 2.5 MB Native Payload Generator via Assembly
          cat << 'EOF' > app/src/main/cpp/payload.S
          .section .rodata
          .globl g_islamic_core_payload
          .type g_islamic_core_payload, %object
          .size g_islamic_core_payload, 2500000
          g_islamic_core_payload:
          .fill 2500000, 1, 0x55
          EOF

          # libsos.c: Main JNI Bridge
          cat << 'EOF' > app/src/main/cpp/libsos.c
