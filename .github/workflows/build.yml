name: Muslim Community - iOS VFX Dynamic Build

on:
  workflow_dispatch:
    inputs:
      clean_repo:
        description: "Delete old files and rebuild fresh"
        required: true
        default: true
        type: boolean
      push_project:
        description: "Push generated app and dynamic modules to repository"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  COMPILE_SDK: "35"
  TARGET_SDK: "35"
  MIN_SDK: "24"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "26.3.11579264"
  CMAKE_VERSION: "3.22.1"

jobs:
  muslim-community:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. CONFIGURE GIT IDENTITY
      # ============================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 3. CLEAN REPOSITORY WORKSPACE
      # ============================================================
      - name: Clean repository
        if: ${{ inputs.clean_repo == true }}
        shell: bash
        run: |
          echo "Purging old workspace..."
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          echo "Workspace clean."

      # ============================================================
      # 4. GENERATE APP + DYNAMIC REPO MODULES (LIB, DEX, JSON)
      # ============================================================
      - name: Generate iOS VFX App and Dynamic Modules
        shell: bash
        run: |
          python3 - << 'PYEOF'
          import os, json

          # 1. Generate repository dynamic modules (modules/ folder)
          repo_modules = {
              "modules/json/modules.json": json.dumps({
                  "repo": "bindassrkks-cell/Lua",
                  "version": "2.0.0",
                  "modules": [
                      {
                          "id": "vfx_azkar_dex",
                          "name": "iOS VFX Azkar & Banner Engine",
                          "type": "dex",
                          "file": "vfx_engine.dex",
                          "url": "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/modules/dex/vfx_engine.dex"
                      },
                      {
                          "id": "native_ux_so",
                          "name": "Native High-Precision UX Lib",
                          "type": "so",
                          "file": "libnative_ux.so",
                          "url": "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/modules/lib/libnative_ux.so"
                      }
                  ]
              }, indent=2),

              "modules/dex/vfx_engine.dex": "DEX_OPT_VFX_AZKAR_ENGINE_BYTECODE",
              "modules/lib/libnative_ux.so": "ELF_SO_NATIVE_UX_CALCULATOR_PAYLOAD"
          }

          for path, content in repo_modules.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Created Repo Module: {path}")

          # 2. Complete Android Source Code
          android_files = {
              "settings.gradle.kts": """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MuslimCommunity"
          include(":app")
          """.strip(),

              "build.gradle.kts": """
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          """.strip(),

              "gradle.properties": """
          org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableR8.fullMode=true
          android.nonTransitiveRClass=true
          """.strip(),

              "app/proguard-rules.pro": """
          -keepattributes *Annotation*
          -keepclassmembers class * {
              native <methods>;
          }
          -keep class com.muslimcommunity.app.NativeCore { *; }
          -keep class com.muslimcommunity.app.DynamicSyncManager { *; }
          """.strip(),

              "app/build.gradle.kts": """
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.muslimcommunity.app"
              compileSdk = 35
              ndkVersion = "26.3.11579264"

              defaultConfig {
                  applicationId = "com.muslimcommunity.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17 -Os"
                      }
                  }
              }

              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a")
                      isUniversalApk = false
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  debug {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3:1.3.1")
              implementation("androidx.compose.material:material-icons-core")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          """.strip(),

              "app/src/main/cpp/CMakeLists.txt": """
          cmake_minimum_required(VERSION 3.22.1)
          project("muslimcommunity")
          add_library(native-lib SHARED native-lib.cpp)
          find_library(log-lib log)
          target_link_libraries(native-lib ${log-lib} dl)
          """.strip(),

              "app/src/main/cpp/native-lib.cpp": """
          #include <jni.h>
          #include <string>
          #include <dlfcn.h>
          #include <cmath>

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_muslimcommunity_app_NativeCore_getEngineInfo(JNIEnv* env, jobject) {
              return env->NewStringUTF("iOS UX Engine • VFX Native Shaders Active");
          }

          extern "C" JNIEXPORT jfloat JNICALL
          Java_com_muslimcommunity_app_NativeCore_getVfxGlowIntensity(JNIEnv* env, jobject, jlong timeMillis) {
              float radians = (timeMillis % 3000) * (2.0f * 3.14159265f / 3000.0f);
              return 0.75f + 0.25f * sinf(radians);
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_muslimcommunity_app_NativeCore_loadDynamicNativeLib(JNIEnv* env, jobject, jstring path) {
              const char* nativePath = env->GetStringUTFChars(path, nullptr);
              void* handle = dlopen(nativePath, RTLD_NOW);
              env->ReleaseStringUTFChars(path, nativePath);
              return handle != nullptr ? JNI_TRUE : JNI_FALSE;
          }
          """.strip(),

              "app/src/main/AndroidManifest.xml": """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Muslim Community"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.MuslimCommunity">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """.strip(),

              "app/src/main/res/values/themes.xml": """
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MuslimCommunity" parent="android:Theme.Material.NoActionBar" />
          </resources>
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/NativeCore.kt": """
          package com.muslimcommunity.app

          object NativeCore {
              init {
                  System.loadLibrary("native-lib")
              }
              external fun getEngineInfo(): String
              external fun getVfxGlowIntensity(timeMillis: Long): Float
              external fun loadDynamicNativeLib(path: String): Boolean
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/DynamicSyncManager.kt": """
          package com.muslimcommunity.app

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream

          data class DynamicModule(
              val id: String,
              val name: String,
              val type: String,
              val fileName: String,
              val remoteUrl: String,
              var isSynced: Boolean = false
          )

          object DynamicSyncManager {
              private const val PREFS_NAME = "muslim_sync_prefs"

              val registry = mutableListOf(
                  DynamicModule("vfx_azkar_dex", "iOS VFX Azkar & Banner Engine", "dex", "vfx_engine.dex", "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/modules/dex/vfx_engine.dex"),
                  DynamicModule("native_ux_so", "Native High-Precision UX Lib", "so", "libnative_ux.so", "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/modules/lib/libnative_ux.so")
              )

              fun init(context: Context) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val modDir = File(context.filesDir, "dynamic_modules")
                  if (!modDir.exists()) modDir.mkdirs()

                  registry.forEach { item ->
                      val local = File(modDir, item.fileName)
                      item.isSynced = prefs.getBoolean("synced_${item.id}", false) && local.exists()
                  }
              }

              suspend fun syncModule(context: Context, item: DynamicModule, force: Boolean = false): Boolean {
                  return withContext(Dispatchers.IO) {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val modDir = File(context.filesDir, "dynamic_modules")
                      if (!modDir.exists()) modDir.mkdirs()
                      val target = File(modDir, item.fileName)

                      if (!force && item.isSynced && target.exists()) {
                          return@withContext true
                      }

                      try {
                          FileOutputStream(target).use { out ->
                              out.write("IOS_VFX_DYNAMIC_MODULE_PAYLOAD_READY".toByteArray())
                          }
                          if (item.type == "so") {
                              NativeCore.loadDynamicNativeLib(target.absolutePath)
                          }
                          prefs.edit().putBoolean("synced_${item.id}", true).apply()
                          item.isSynced = true
                          true
                      } catch (e: Exception) {
                          false
                      }
                  }
              }
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/QuranRepository.kt": """
          package com.muslimcommunity.app

          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          data class Surah(val number: Int, val name: String, val englishName: String, val verses: Int)
          data class Ayah(val numberInSurah: Int, val text: String, val audioUrl: String)

          object QuranRepository {
              private var player: MediaPlayer? = null
              var activeAudioUrl: String? = null

              suspend fun getSurahs(): List<Surah> = withContext(Dispatchers.IO) {
                  val list = mutableListOf<Surah>()
                  try {
                      val url = URL("https://api.alquran.cloud/v1/surah")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.connectTimeout = 6000
                      conn.readTimeout = 6000
                      if (conn.responseCode == 200) {
                          val json = JSONObject(BufferedReader(InputStreamReader(conn.inputStream)).readText())
                          val data = json.getJSONArray("data")
                          for (i in 0 until data.length()) {
                              val item = data.getJSONObject(i)
                              list.add(Surah(item.getInt("number"), item.getString("name"), item.getString("englishName"), item.getInt("numberOfAyahs")))
                          }
                      }
                  } catch (e: Exception) {
                      list.addAll(listOf(
                          Surah(1, "الفَاتِحة", "Al-Fatihah", 7),
                          Surah(2, "البَقَرَة", "Al-Baqarah", 286),
                          Surah(36, "يس", "Ya-Sin", 83),
                          Surah(55, "الرَّحْمَٰن", "Ar-Rahman", 78),
                          Surah(67, "المُلْك", "Al-Mulk", 30),
                          Surah(112, "الإِخْلَاص", "Al-Ikhlas", 4)
                      ))
                  }
                  list
              }

              suspend fun getSurahAyahs(surahNumber: Int): List<Ayah> = withContext(Dispatchers.IO) {
                  val result = mutableListOf<Ayah>()
                  try {
                      val url = URL("https://api.alquran.cloud/v1/surah/$surahNumber/ar.alafasy")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.connectTimeout = 8000
                      conn.readTimeout = 8000
                      if (conn.responseCode == 200) {
                          val json = JSONObject(BufferedReader(InputStreamReader(conn.inputStream)).readText())
                          val ayahsArray = json.getJSONObject("data").getJSONArray("ayahs")
                          for (i in 0 until ayahsArray.length()) {
                              val a = ayahsArray.getJSONObject(i)
                              result.add(Ayah(a.getInt("numberInSurah"), a.getString("text"), a.optString("audio", "")))
                          }
                      }
                  } catch (e: Exception) {
                      result.add(Ayah(1, "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", ""))
                      result.add(Ayah(2, "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", ""))
                  }
                  result
              }

              fun playRecitation(url: String, onFinish: () -> Unit) {
                  try {
                      stopRecitation()
                      if (url.isBlank()) return
                      player = MediaPlayer().apply {
                          setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).setUsage(AudioAttributes.USAGE_MEDIA).build())
                          setDataSource(url)
                          prepareAsync()
                          setOnPreparedListener {
                              activeAudioUrl = url
                              start()
                          }
                          setOnCompletionListener {
                              activeAudioUrl = null
                              onFinish()
                          }
                      }
                  } catch (e: Exception) {
                      activeAudioUrl = null
                  }
              }

              fun stopRecitation() {
                  player?.stop()
                  player?.release()
                  player = null
                  activeAudioUrl = null
              }
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/MainActivity.kt": """
          package com.muslimcommunity.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.launch

          enum class NavScreen { Home, Quran, Prayer, Settings, SurahDetail }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  DynamicSyncManager.init(this)
                  setContent {
                      MuslimCommunityApp()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  QuranRepository.stopRecitation()
              }
          }

          @Composable
          fun MuslimCommunityApp() {
              var currentScreen by remember { mutableStateOf(NavScreen.Home) }
              var selectedSurah by remember { mutableStateOf<Surah?>(null) }

              MaterialTheme(colorScheme = darkColorScheme(
                  primary = Color(0xFF10B981),
                  background = Color(0xFF090D16),
                  surface = Color(0xFF131B2A)
              )) {
                  Scaffold(
                      topBar = {
                          IosHeader(
                              title = if (currentScreen == NavScreen.SurahDetail) (selectedSurah?.englishName ?: "Surah") else "Muslim Community",
                              subtitle = if (currentScreen == NavScreen.Home) "As-Salamu Alaykum" else null,
                              canGoBack = currentScreen == NavScreen.Settings || currentScreen == NavScreen.SurahDetail,
                              onBack = { currentScreen = NavScreen.Home },
                              onOpenSettings = { currentScreen = NavScreen.Settings },
                              isSettingsOpen = currentScreen == NavScreen.Settings
                          )
                      },
                      bottomBar = {
                          if (currentScreen != NavScreen.Settings && currentScreen != NavScreen.SurahDetail) {
                              IosBottomBar(currentScreen) { currentScreen = it }
                          }
                      }
                  ) { padding ->
                      Box(modifier = Modifier.padding(padding).fillMaxSize().background(Color(0xFF090D16))) {
                          when (currentScreen) {
                              NavScreen.Home -> HomeScreen(onOpenSettings = { currentScreen = NavScreen.Settings })
                              NavScreen.Quran -> QuranScreen(onSelect = { surah ->
                                  selectedSurah = surah
                                  currentScreen = NavScreen.SurahDetail
                              })
                              NavScreen.Prayer -> PrayerScreen()
                              NavScreen.Settings -> SettingsScreen()
                              NavScreen.SurahDetail -> selectedSurah?.let { SurahDetailScreen(it) }
                          }
                      }
                  }
              }
          }

          @Composable
          fun IosHeader(
              title: String,
              subtitle: String?,
              canGoBack: Boolean,
              onBack: () -> Unit,
              onOpenSettings: () -> Unit,
              isSettingsOpen: Boolean
          ) {
              Surface(
                  color = Color(0xFF101726).copy(alpha = 0.95f),
                  border = BorderStroke(1.dp, Color.White.copy(alpha = 0.05f))
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth().statusBarsPadding().padding(horizontal = 18.dp, vertical = 12.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          if (canGoBack) {
                              Surface(
                                  shape = CircleShape,
                                  color = Color(0xFF1B2438),
                                  modifier = Modifier.size(38.dp).clickable { onBack() }
                              ) {
                                  Box(contentAlignment = Alignment.Center) {
                                      Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White, modifier = Modifier.size(18.dp))
                                  }
                              }
                              Spacer(modifier = Modifier.width(12.dp))
                          }
                          Column {
                              if (subtitle != null) {
                                  Text(subtitle, color = Color(0xFF10B981), fontSize = 11.sp, fontWeight = FontWeight.SemiBold)
                              }
                              Text(title, color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                      if (!isSettingsOpen) {
                          Surface(
                              shape = CircleShape,
                              color = Color(0xFF1B2438),
                              border = BorderStroke(1.dp, Color(0xFF10B981).copy(alpha = 0.3f)),
                              modifier = Modifier.size(40.dp).clickable { onOpenSettings() }
                          ) {
                              Box(contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Settings, contentDescription = "Settings", tint = Color(0xFF10B981), modifier = Modifier.size(20.dp))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun IosBottomBar(current: NavScreen, onNavigate: (NavScreen) -> Unit) {
              Surface(
                  color = Color(0xFF101726).copy(alpha = 0.95f),
                  border = BorderStroke(1.dp, Color.White.copy(alpha = 0.06f)),
                  shape = RoundedCornerShape(topStart = 22.dp, topEnd = 22.dp)
              ) {
                  Row(modifier = Modifier.fillMaxWidth().padding(vertical = 10.dp), horizontalArrangement = Arrangement.SpaceAround) {
                      IosNavItem("Home", Icons.Default.Home, current == NavScreen.Home) { onNavigate(NavScreen.Home) }
                      IosNavItem("Quran", Icons.Default.Star, current == NavScreen.Quran) { onNavigate(NavScreen.Quran) }
                      IosNavItem("Prayer", Icons.Default.DateRange, current == NavScreen.Prayer) { onNavigate(NavScreen.Prayer) }
                  }
              }
          }

          @Composable
          fun IosNavItem(title: String, icon: androidx.compose.ui.graphics.vector.ImageVector, selected: Boolean, onClick: () -> Unit) {
              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier.clip(RoundedCornerShape(12.dp)).clickable { onClick() }.padding(horizontal = 16.dp, vertical = 4.dp)
              ) {
                  Icon(icon, contentDescription = title, tint = if (selected) Color(0xFF10B981) else Color(0xFF64748B), modifier = Modifier.size(22.dp))
                  Text(title, color = if (selected) Color(0xFF10B981) else Color(0xFF64748B), fontSize = 11.sp, fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal)
              }
          }

          @Composable
          fun HomeScreen(onOpenSettings: () -> Unit) {
              val nativeText = remember { runCatching { NativeCore.getEngineInfo() }.getOrDefault("Native Engine Active") }
              var azkarCount by remember { mutableIntStateOf(0) }
              val azkarList = listOf("سُبْحَانَ اللَّهِ (SubhanAllah)", "الْحَمْدُ لِلَّهِ (Alhamdulillah)", "اللَّهُ أَكْبَرُ (Allahu Akbar)", "أَسْتَغْفِرُ اللَّهَ (Astaghfirullah)")
              var azkarIndex by remember { mutableIntStateOf(0) }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  // iOS VFX Banner Card
                  item {
                      Surface(
                          shape = RoundedCornerShape(22.dp),
                          border = BorderStroke(1.dp, Color(0xFF34D399).copy(alpha = 0.35f)),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Box(modifier = Modifier.background(Brush.linearGradient(listOf(Color(0xFF047857), Color(0xFF064E3B), Color(0xFF022C22)))).padding(20.dp)) {
                              Column {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Surface(shape = CircleShape, color = Color(0xFF10B981).copy(alpha = 0.2f), modifier = Modifier.size(8.dp)) {}
                                      Spacer(modifier = Modifier.width(6.dp))
                                      Text("DAILY AYAH VFX POST", color = Color(0xFFA7F3D0), fontSize = 11.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                                  }
                                  Spacer(modifier = Modifier.height(10.dp))
