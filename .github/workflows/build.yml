          """.strip()
          }

          for path, content in android_files.items():
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Generated: {path}")

          print("Generated iOS VFX Muslim Community Project successfully.")
          PYEOF

      # ============================================================
      # 5. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================================
      # 6. SETUP ANDROID SDK & NDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

      # ============================================================
      # 7. CONFIGURE LOCAL.PROPERTIES
      # ============================================================
      - name: Configure local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          EOF

      # ============================================================
      # 8. SETUP GRADLE WRAPPER
      # ============================================================
      - name: Setup Gradle Wrapper
        run: |
          curl -sLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
          chmod +x ./gradlew
          rm -rf /tmp/gradle*

      # ============================================================
      # 9. COMPILE FAST ULTRA-LIGHT APK
      # ============================================================
      - name: Compile Ultra-Light APKs
        run: |
          ./gradlew assembleRelease --no-daemon --parallel --build-cache

      # ============================================================
      # 10. VERIFY APKS SIZE (2-4 MB)
      # ============================================================
      - name: Verify Output Sizes
        run: |
          echo "======================================"
          echo "BUILT RELEASE APKS:"
          ls -lh app/build/outputs/apk/release/*.apk
          echo "======================================"

      # ============================================================
      # 11. COMMIT & PUSH APP + MODULES (LIB, DEX, JSON) TO REPO
      # ============================================================
      - name: Push All Sources & Modules to Repo
        if: ${{ inputs.push_project == true }}
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: iOS VFX UI, Azkar Counter & Dynamic Repo Modules (lib, dex, json) [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
            echo "Pushed app and dynamic modules to repository."
          fi

      # ============================================================
      # 12. UPLOAD RELEASE ARTIFACTS
      # ============================================================
      - name: Upload Ultra-Light APKs
        uses: actions/upload-artifact@v4
        with:
          name: MuslimCommunity-release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
