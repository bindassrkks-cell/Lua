name: Zombie Battle Royale - Full Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

  ANDROID_ABI: "arm64-v8a"
  MIN_SDK: "24"
  TARGET_SDK: "36"

  GRADLE_VERSION: "9.3.1"
  AGP_VERSION: "9.1.1"

  BUILD_TYPE: "Release"

  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx4g


jobs:

  build:
    name: Build Zombie Battle Royale ARM64 APK
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # ========================================================
      # SYSTEM INFORMATION
      # ========================================================

      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " RUNNER"
          echo "=========================================="

          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Repository:"
          pwd

          echo
          echo "Top-level:"
          ls -la


      # ========================================================
      # JAVA 17
      # ========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      - name: Verify Java
        shell: bash
        run: |
          set -euxo pipefail

          java -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # ========================================================
      # ANDROID SDK
      # ========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK tools
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | sdkmanager --licenses >/dev/null || true


      # ========================================================
      # ANDROID ENVIRONMENT
      # ========================================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          CMAKE_PATH="${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}"

          test -d "$NDK_PATH"
          test -d "$CMAKE_PATH"

          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

          echo "$CMAKE_PATH/bin" >> "$GITHUB_PATH"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "NDK:"
          echo "$NDK_PATH"

          echo
          echo "CMake:"
          "$CMAKE_PATH/bin/cmake" --version

          echo
          echo "Installed Android packages:"
          sdkmanager --list_installed | head -150


      # ========================================================
      # INSTALL LINUX BUILD DEPENDENCIES
      # ========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            lua5.4 \
            unzip \
            zip \
            curl \
            git \
            file


      # ========================================================
      # VERIFY LUA
      # ========================================================

      - name: Verify Lua
        shell: bash
        run: |
          set -euxo pipefail

          echo "Lua:"
          lua5.4 -v

          echo
          echo "Lua compiler:"
          luac5.4 -v


      # ========================================================
      # CREATE DIRECTORIES
      # ========================================================

      - name: Prepare project directories
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            android/app/src/main/java/com/zbr/game \
            android/app/src/main/res/values \
            android/app/src/main/cpp \
            engine/src \
            engine/include \
            game/scripts \
            game/assets

          echo "Directories ready."


      # ========================================================
      # GENERATE ROOT SETTINGS ONLY IF MISSING
      # ========================================================

      - name: Create Gradle project files if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f settings.gradle.kts ]; then

            cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ZombieBattleRoyale"

          include(":app")

          project(":app").projectDir = file("android/app")
          EOF

          fi


          if [ ! -f build.gradle.kts ]; then

            cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

          fi


          if [ ! -f gradle.properties ]; then

            cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          fi


      # ========================================================
      # CREATE ANDROID APP IF MISSING
      # ========================================================

      - name: Create Android application if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f android/app/build.gradle.kts ]; then

            cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.zbr.game"

              compileSdk = 36

              ndkVersion = "28.2.13676358"

              defaultConfig {
                  applicationId = "com.zbr.game"

                  minSdk = 24
                  targetSdk = 36

                  versionCode = 1
                  versionName = "0.1.0"

                  ndk {
                      abiFilters += "arm64-v8a"
                  }
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }

                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false

                      proguardFiles(
                          getDefaultProguardFile(
                              "proguard-android-optimize.txt"
                          ),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.31.6"
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = false
                  }

                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
          }
          EOF

          fi


          if [ ! -f android/app/proguard-rules.pro ]; then

            cat > android/app/proguard-rules.pro <<'EOF'
          -keep class com.zbr.game.** { *; }
          EOF

          fi


      # ========================================================
      # CREATE MANIFEST IF MISSING
      # ========================================================

      - name: Create Android manifest if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then

            cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-feature
                  android:glEsVersion="0x00030000"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.vulkan.version"
                  android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="Zombie Battle Royale"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:resizeableActivity="false">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          fi


      # ========================================================
      # CREATE THEME IF MISSING
      # ========================================================

      - name: Create Android theme if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f android/app/src/main/res/values/styles.xml ]; then

            cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>

              </style>

          </resources>
          EOF

          fi


      # ========================================================
      # CREATE C++ ENGINE CMAKE IF MISSING
      # ========================================================

      - name: Create engine CMake if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f engine/CMakeLists.txt ]; then

            cat > engine/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)

          project(ZombieBattleRoyaleEngine)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          add_library(
              zbr_engine
              SHARED
              src/Engine.cpp
          )

          target_include_directories(
              zbr_engine
              PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}/include
          )

          find_library(log-lib log)
          find_library(android-lib android)

          target_link_libraries(
              zbr_engine
              ${log-lib}
              ${android-lib}
          )

          set_target_properties(
              zbr_engine
              PROPERTIES
              OUTPUT_NAME "zbr_engine"
          )
          EOF

          fi


      # ========================================================
      # CREATE ENGINE SOURCE IF MISSING
      # ========================================================

      - name: Create C++ engine source if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f engine/src/Engine.cpp ]; then

            cat > engine/src/Engine.cpp <<'EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <atomic>

          #define ZBR_LOG_TAG "ZBR_ENGINE"

          static std::atomic<bool> g_running{false};

          extern "C"
          JNIEXPORT void JNICALL
          Java_com_zbr_game_MainActivity_nativeStart(
              JNIEnv*,
              jobject) {

              g_running.store(true);

              __android_log_print(
                  ANDROID_LOG_INFO,
                  ZBR_LOG_TAG,
                  "Engine started"
              );
          }


          extern "C"
          JNIEXPORT void JNICALL
          Java_com_zbr_game_MainActivity_nativeStop(
              JNIEnv*,
              jobject) {

              g_running.store(false);

              __android_log_print(
                  ANDROID_LOG_INFO,
                  ZBR_LOG_TAG,
                  "Engine stopped"
              );
          }


          extern "C"
          JNIEXPORT jboolean JNICALL
          Java_com_zbr_game_MainActivity_nativeIsRunning(
              JNIEnv*,
              jobject) {

              return g_running.load()
                  ? JNI_TRUE
                  : JNI_FALSE;
          }
          EOF

          fi


      # ========================================================
      # CREATE ANDROID NATIVE CMAKE
      # ========================================================

      - name: Create Android native CMake if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f android/app/src/main/cpp/CMakeLists.txt ]; then

            cat > android/app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)

          project(ZombieBattleRoyaleAndroid)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          set(ENGINE_DIR
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../engine
          )

          add_library(
              zbr_engine
              SHARED
              ${ENGINE_DIR}/src/Engine.cpp
          )

          target_include_directories(
              zbr_engine
              PRIVATE
              ${ENGINE_DIR}/include
          )

          find_library(log-lib log)
          find_library(android-lib android)

          target_link_libraries(
              zbr_engine
              ${log-lib}
              ${android-lib}
          )
          EOF

          fi


      # ========================================================
      # CREATE MAIN ACTIVITY IF MISSING
      # ========================================================

      - name: Create MainActivity if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f android/app/src/main/java/com/zbr/game/MainActivity.java ]; then

            cat > android/app/src/main/java/com/zbr/game/MainActivity.java <<'EOF'
          package com.zbr.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.view.Gravity;

          public class MainActivity extends Activity {

              static {
                  System.loadLibrary("zbr_engine");
              }

              private native void nativeStart();

              private native void nativeStop();

              private native boolean nativeIsRunning();

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow()
                      .getDecorView()
                      .setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );

                  nativeStart();

                  TextView view = new TextView(this);

                  view.setText(
                      "ZOMBIE BATTLE ROYALE\n\n" +
                      "C++ ENGINE ONLINE\n" +
                      "ARM64 • ANDROID\n\n" +
                      "CUSTOM ENGINE + LUA"
                  );

                  view.setTextColor(Color.WHITE);
                  view.setTextSize(22);
                  view.setGravity(Gravity.CENTER);
                  view.setBackgroundColor(Color.BLACK);

                  setContentView(view);
              }

              @Override
              protected void onDestroy() {

                  nativeStop();

                  super.onDestroy();
              }
          }
          EOF

          fi


      # ========================================================
      # LUA FILES IF MISSING
      # ========================================================

      - name: Create Lua gameplay files if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f game/scripts/game.lua ]; then

            cat > game/scripts/game.lua <<'EOF'
          local Game = {}

          Game.name = "Zombie Battle Royale"

          Game.maxPlayers = 30

          Game.zombiesEnabled = true

          function Game.startMatch()
              print("Zombie Battle Royale match started")
          end

          return Game
          EOF

          fi


          if [ ! -f game/scripts/weapons.lua ]; then

            cat > game/scripts/weapons.lua <<'EOF'
          local Weapons = {}

          Weapons.assault_rifle = {
              damage = 32,
              magazine = 30,
              recoil = 1.0
          }

          Weapons.shotgun = {
              damage = 80,
              magazine = 8,
              recoil = 2.5
          }

          return Weapons
          EOF

          fi


          if [ ! -f game/scripts/zombies.lua ]; then

            cat > game/scripts/zombies.lua <<'EOF'
          local Zombies = {}

          Zombies.maxAlive = 100

          function Zombies.spawn(x, y, z)

              return {
                  x = x,
                  y = y,
                  z = z,
                  health = 100
              }

          end

          return Zombies
          EOF

          fi


      # ========================================================
      # LUA VALIDATION
      # ========================================================

      - name: Validate Lua scripts
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " LUA VALIDATION"
          echo "=========================================="

          LUA_COUNT=0

          while IFS= read -r -d '' file; do

              LUA_COUNT=$((LUA_COUNT + 1))

              echo
              echo "Checking:"
              echo "$file"

              luac5.4 -p "$file"

              echo "PASS: $file"

          done < <(
              find game/scripts \
                  -type f \
                  -name "*.lua" \
                  -print0
          )

          echo
          echo "Lua files checked: $LUA_COUNT"

          if [ "$LUA_COUNT" -eq 0 ]; then
              echo "::warning::No Lua files found."
          fi

          echo
          echo "Lua validation: PASS"


      # ========================================================
      # DOWNLOAD GRADLE
      # ========================================================

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euxo pipefail

          GRADLE_DIR="$HOME/gradle-${GRADLE_VERSION}"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then

              rm -f /tmp/gradle.zip

              curl \
                --fail \
                --show-error \
                --location \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                -o /tmp/gradle.zip \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

              rm -rf "$GRADLE_DIR"

              unzip \
                -q \
                /tmp/gradle.zip \
                -d "$HOME"

          fi

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

          "$GRADLE_DIR/bin/gradle" --version


      # ========================================================
      # PROJECT VALIDATION
      # ========================================================

      - name: Validate complete project
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo " PROJECT VALIDATION"
          echo "=========================================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

          test -f \
            android/app/src/main/java/com/zbr/game/MainActivity.java

          test -f \
            android/app/src/main/cpp/CMakeLists.txt

          test -f engine/CMakeLists.txt
          test -f engine/src/Engine.cpp

          test -d game
          test -d game/scripts
          test -d game/assets

          echo
          echo "Project validation: PASS"


      # ========================================================
      # STANDALONE C++ ENGINE TEST
      # ========================================================

      - name: Configure standalone C++ engine
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/native

          cmake \
            -S engine \
            -B build/native \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${MIN_SDK}" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON


      - name: Build standalone C++ engine
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build build/native \
            --config "${BUILD_TYPE}" \
            --parallel "$(nproc)"

          echo
          echo "Native output:"

          find build/native \
            -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print


      # ========================================================
      # ANDROID GRADLE BUILD
      # ========================================================

      - name: Build Android Release APK
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleRelease


      # ========================================================
      # LOCATE APK
      # ========================================================

      - name: Locate APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(
            find . \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          if [ "$APK_COUNT" -lt 1 ]; then

              echo "::error::No APK generated."

              exit 1

          fi

          echo
          echo "APK count:"
          echo "$APK_COUNT"


      # ========================================================
      # CHECK ARM64 APK
      # ========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APK=$(
            find android \
              -type f \
              -name "*release*.apk" \
              | head -n 1
          )

          if [ -z "$APK" ]; then

              APK=$(
                find . \
                  -type f \
                  -name "*.apk" \
                  | head -n 1
              )

          fi

          test -n "$APK"

          echo "APK:"
          echo "$APK"

          echo
          echo "Size:"
          ls -lh "$APK"

          echo
          echo "APK summary:"

          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            apk summary \
            "$APK" || true


      # ========================================================
      # PREPARE FINAL APK
      # ========================================================

      - name: Prepare release artifact
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf release

          mkdir -p release

          APK=$(
            find android \
              -type f \
              -name "*release*.apk" \
              | head -n 1
          )

          if [ -z "$APK" ]; then

              APK=$(
                find . \
                  -type f \
                  -name "*.apk" \
                  | head -n 1
              )

          fi

          test -n "$APK"

          cp \
            "$APK" \
            "release/ZombieBattleRoyale-arm64-release.apk"

          echo
          echo "FINAL APK:"
          ls -lh release/


      # ========================================================
      # UPLOAD APK
      # ========================================================

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: ZombieBattleRoyale-Android-ARM64
          path: release/ZombieBattleRoyale-arm64-release.apk
          if-no-files-found: error
          retention-days: 14


      # ========================================================
      # UPLOAD NATIVE BUILD
      # ========================================================

      - name: Upload native engine
        uses: actions/upload-artifact@v6
        with:
          name: ZombieBattleRoyale-Native-ARM64
          path: build/native/**
          if-no-files-found: error
          retention-days: 7


      # ========================================================
      # FINAL REPORT
      # ========================================================

      - name: Final build report
        if: always()
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo " ZOMBIE BATTLE ROYALE BUILD REPORT"
          echo "=================================================="
          echo
          echo "Java        : ${JAVA_VERSION}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "NDK         : ${NDK_VERSION}"
          echo "CMake       : ${CMAKE_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"
          echo "AGP         : ${AGP_VERSION}"
          echo "ABI         : ${ANDROID_ABI}"
          echo "Min SDK     : ${MIN_SDK}"
          echo "Target SDK  : ${TARGET_SDK}"
          echo "Build Type  : ${BUILD_TYPE}"
          echo
          echo "Disk:"
          df -h
          echo
          echo "Release:"
          ls -lh release/ 2>/dev/null || true
          echo
          echo "=================================================="