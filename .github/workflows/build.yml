name: Muslim Community - Dynamic Lib System & Push

on:
  workflow_dispatch:
    inputs:
      clean_repo:
        description: "Delete existing project files and generate new dynamic project"
        required: true
        default: true
        type: boolean
      push_project:
        description: "Push generated project back to repository"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  COMPILE_SDK: "35"
  TARGET_SDK: "35"
  MIN_SDK: "24"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "26.3.11579264"
  CMAKE_VERSION: "3.22.1"

jobs:
  muslim-community:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. CONFIGURE GIT
      # ============================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 3. CLEAN REPOSITORY WORKSPACE
      # ============================================================
      - name: Clean repository
        if: ${{ inputs.clean_repo == true }}
        shell: bash
        run: |
          echo "Purging old workspace..."
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          echo "Workspace cleaned."

      # ============================================================
      # 4. GENERATE COMPLETE DYNAMIC ARCHITECTURE PROJECT
      # ============================================================
      - name: Generate Dynamic Project Files
        shell: bash
        run: |
          python3 - << 'PYEOF'
          import os

          files = {
              "settings.gradle.kts": """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MuslimCommunity"
          include(":app")
          """.strip(),

              "build.gradle.kts": """
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          """.strip(),

              "gradle.properties": """
          org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableR8.fullMode=true
          android.nonTransitiveRClass=true
          """.strip(),

              "app/proguard-rules.pro": """
          -keepattributes *Annotation*
          -keepattributes Signature
          -keepclassmembers class * {
              native <methods>;
          }
          # Keep dynamic loader classes and interfaces for reflection
          -keep class com.muslimcommunity.app.dynamic.** { *; }
          -keep interface com.muslimcommunity.app.dynamic.** { *; }
          -keep class com.muslimcommunity.app.NativeCore { *; }
          """.strip(),

              "app/build.gradle.kts": """
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.muslimcommunity.app"
              compileSdk = 35
              ndkVersion = "26.3.11579264"

              defaultConfig {
                  applicationId = "com.muslimcommunity.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17 -Os"
                      }
                  }
              }

              // ABI splits produce isolated 2-3 MB APKs
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a")
                      isUniversalApk = false
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  debug {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3:1.3.1")
              implementation("androidx.compose.material:material-icons-core")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          """.strip(),

              "app/src/main/cpp/CMakeLists.txt": """
          cmake_minimum_required(VERSION 3.22.1)
          project("muslimcommunity")
          add_library(native-lib SHARED native-lib.cpp)
          find_library(log-lib log)
          target_link_libraries(native-lib ${log-lib} dl)
          """.strip(),

              "app/src/main/cpp/native-lib.cpp": """
          #include <jni.h>
          #include <string>
          #include <dlfcn.h>
          #include <android/log.h>

          #define LOG_TAG "NativeDynamicLoader"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_muslimcommunity_app_NativeCore_getEngineInfo(JNIEnv* env, jobject) {
              return env->NewStringUTF("Core Engine 2.0 (Dynamic SO Loader Ready)");
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_muslimcommunity_app_NativeCore_loadDynamicNativeLib(JNIEnv* env, jobject, jstring libPath) {
              const char* path = env->GetStringUTFChars(libPath, nullptr);
              void* handle = dlopen(path, RTLD_NOW);
              env->ReleaseStringUTFChars(libPath, path);
              if (!handle) {
                  return JNI_FALSE;
              }
              return JNI_TRUE;
          }
          """.strip(),

              "app/src/main/AndroidManifest.xml": """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Muslim Community"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MuslimCommunity">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """.strip(),

              "app/src/main/res/values/themes.xml": """
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MuslimCommunity" parent="android:Theme.Material.NoActionBar" />
          </resources>
          """.strip(),

              "app/src/main/res/values/strings.xml": """
          <resources>
              <string name="app_name">Muslim Community</string>
          </resources>
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/NativeCore.kt": """
          package com.muslimcommunity.app

          object NativeCore {
              init {
                  System.loadLibrary("native-lib")
              }
              external fun getEngineInfo(): String
              external fun loadDynamicNativeLib(libPath: String): Boolean
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/dynamic/DynamicFeaturePlugin.kt": """
          package com.muslimcommunity.app.dynamic

          import android.content.Context

          interface DynamicFeaturePlugin {
              val moduleId: String
              val moduleName: String
              val version: String
              fun executeFeature(context: Context, action: String, payload: Map<String, Any>): Map<String, Any>
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/dynamic/DynamicDexLoader.kt": """
          package com.muslimcommunity.app.dynamic

          import android.content.Context
          import dalvik.system.DexClassLoader
          import java.io.File

          object DynamicDexLoader {
              fun loadPlugin(context: Context, dexFile: File, className: String): DynamicFeaturePlugin? {
                  return try {
                      val optDir = File(context.codeCacheDir, "opt_dex")
                      if (!optDir.exists()) optDir.mkdirs()

                      val classLoader = DexClassLoader(
                          dexFile.absolutePath,
                          optDir.absolutePath,
                          null,
                          context.classLoader
                      )
                      val loadedClass = classLoader.loadClass(className)
                      loadedClass.getDeclaredConstructor().newInstance() as? DynamicFeaturePlugin
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/dynamic/DynamicDependencyManager.kt": """
          package com.muslimcommunity.app.dynamic

          import android.content.Context
          import com.muslimcommunity.app.NativeCore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          data class DynamicDependency(
              val id: String,
              val name: String,
              val remoteUrl: String,
              val fileName: String,
              val isNative: Boolean,
              var isInstalled: Boolean = false
          )

          object DynamicDependencyManager {
              val registry = mutableListOf(
                  DynamicDependency("lib_quran", "Quran Tafseer & Audio Core", "https://example.com/libs/quran_core.dex", "quran_core.dex", false),
                  DynamicDependency("lib_prayer", "High-Precision Astro Prayer Math", "https://example.com/libs/prayer_math.dex", "prayer_math.dex", false),
                  DynamicDependency("lib_native_crypto", "Native Supabase C++ Crypto Lib", "https://example.com/libs/libcrypto_engine.so", "libcrypto_engine.so", true)
              )

              fun init(context: Context) {
                  val libDir = File(context.filesDir, "dynamic_libs")
                  if (!libDir.exists()) libDir.mkdirs()

                  registry.forEach { dep ->
                      val target = File(libDir, dep.fileName)
                      dep.isInstalled = target.exists()
                  }
              }

              suspend fun downloadAndLoad(context: Context, dep: DynamicDependency): Boolean {
                  return withContext(Dispatchers.IO) {
                      try {
                          val libDir = File(context.filesDir, "dynamic_libs")
                          if (!libDir.exists()) libDir.mkdirs()
                          val target = File(libDir, dep.fileName)

                          // Mock / Demo auto-installer for verification
                          if (!target.exists()) {
                              FileOutputStream(target).use { out ->
                                  out.write("// Dynamic Loaded Lib Payload".toByteArray())
                              }
                          }

                          if (dep.isNative) {
                              NativeCore.loadDynamicNativeLib(target.absolutePath)
                          }
                          dep.isInstalled = true
                          true
                      } catch (e: Exception) {
                          false
                      }
                  }
              }
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/MainActivity.kt": """
          package com.muslimcommunity.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.muslimcommunity.app.dynamic.DynamicDependency
          import com.muslimcommunity.app.dynamic.DynamicDependencyManager
          import kotlinx.coroutines.launch

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  DynamicDependencyManager.init(this)
                  setContent {
                      MuslimCommunityApp()
                  }
              }
          }

          @Composable
          fun MuslimCommunityApp() {
              var selectedTab by remember { mutableIntStateOf(0) }
              val nativeText = remember { runCatching { NativeCore.getEngineInfo() }.getOrDefault("Native Core Loaded") }

              MaterialTheme(colorScheme = darkColorScheme(
                  primary = Color(0xFF10B981),
                  background = Color(0xFF0F172A),
                  surface = Color(0xFF1E293B)
              )) {
                  Scaffold(
                      bottomBar = {
                          NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                              val items = listOf("Home", "Dynamic Libs", "Quran", "Prayer")
                              val icons = listOf(Icons.Default.Home, Icons.Default.Refresh, Icons.Default.Star, Icons.Default.DateRange)
                              items.forEachIndexed { index, title ->
                                  NavigationBarItem(
                                      selected = selectedTab == index,
                                      onClick = { selectedTab = index },
                                      icon = { Icon(icons[index], contentDescription = title) },
                                      label = { Text(title) }
                                  )
                              }
                          }
                      }
                  ) { innerPadding ->
                      Box(modifier = Modifier.padding(innerPadding).fillMaxSize().background(MaterialTheme.colorScheme.background)) {
                          when (selectedTab) {
                              0 -> HomeTab(nativeText)
                              1 -> DynamicLibsTab()
                              2 -> QuranTab()
                              3 -> PrayerTab()
                          }
                      }
                  }
              }
          }

          @Composable
          fun HomeTab(nativeText: String) {
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF059669)),
                          shape = RoundedCornerShape(16.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(18.dp)) {
                              Text("Daily Ayat", color = Color.White, fontSize = 13.sp)
                              Spacer(modifier = Modifier.height(6.dp))
                              Text("“Indeed, Allah is with those who are patient.”", color = Color.White, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                              Text("Surah Al-Baqarah 2:153", color = Color(0xFFA7F3D0), fontSize = 12.sp)
                          }
                      }
                  }
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("Dynamic Architecture Status", color = Color.White, fontWeight = FontWeight.Bold)
                              Spacer(modifier = Modifier.height(4.dp))
                              Text(nativeText, color = Color(0xFF10B981), fontSize = 13.sp)
                              Spacer(modifier = Modifier.height(4.dp))
                              Text("Base APK: ~2.5 MB • Dependencies: Dynamic Loaded", color = Color.LightGray, fontSize = 12.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun DynamicLibsTab() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var dependencies by remember { mutableStateOf(DynamicDependencyManager.registry.toList()) }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  item {
                      Text("Dynamic Library Manager", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Text("Modules and dependencies load dynamically on-demand", color = Color.Gray, fontSize = 12.sp)
                  }
                  items(dependencies) { dep ->
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), modifier = Modifier.fillMaxWidth()) {
                          Row(
                              modifier = Modifier.padding(16.dp).fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(dep.name, color = Color.White, fontWeight = FontWeight.SemiBold)
                                  Text(
                                      if (dep.isNative) "Native .SO Library" else "Dynamic DEX Module",
                                      color = Color(0xFF10B981),
                                      fontSize = 11.sp
                                  )
                              }
                              Button(
                                  onClick = {
                                      scope.launch {
                                          DynamicDependencyManager.downloadAndLoad(context, dep)
                                          dependencies = DynamicDependencyManager.registry.toList()
                                      }
                                  },
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = if (dep.isInstalled) Color(0xFF047857) else Color(0xFF2563EB)
                                  )
                              ) {
                                  Text(if (dep.isInstalled) "Loaded" else "Load Lib", fontSize = 12.sp)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun QuranTab() {
              val surahs = listOf("1. Al-Fatihah", "2. Al-Baqarah", "36. Ya-Sin", "55. Ar-Rahman", "67. Al-Mulk")
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  items(surahs) { surah ->
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), modifier = Modifier.fillMaxWidth()) {
                          Text(surah, modifier = Modifier.padding(16.dp), color = Color.White, fontWeight = FontWeight.Medium)
                      }
                  }
              }
          }

          @Composable
          fun PrayerTab() {
              val prayers = listOf("Fajr" to "05:00 AM", "Dhuhr" to "12:15 PM", "Asr" to "03:45 PM", "Maghrib" to "06:10 PM", "Isha" to "07:30 PM")
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(prayers) { (name, time) ->
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), modifier = Modifier.fillMaxWidth()) {
                          Row(modifier = Modifier.padding(16.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                              Text(name, color = Color.White, fontWeight = FontWeight.Bold)
                              Text(time, color = Color(0xFF10B981), fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }
          }
          """.strip()
          }

          for path, content in files.items():
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Created: {path}")

          print("Generated dynamic system project successfully.")
          PYEOF

      # ============================================================
      # 5. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================================
      # 6. SETUP ANDROID SDK & NDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

      # ============================================================
      # 7. CONFIGURE LOCAL.PROPERTIES
      # ============================================================
      - name: Configure local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          EOF

      # ============================================================
      # 8. SETUP GRADLE WRAPPER
      # ============================================================
      - name: Setup Gradle Wrapper
        run: |
          curl -sLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
          chmod +x ./gradlew
          rm -rf /tmp/gradle*

      # ============================================================
      # 9. COMPILE ULTRA-LIGHT RELEASE APKS
      # ============================================================
      - name: Compile Ultra-Light APKs
        run: |
          ./gradlew assembleRelease --no-daemon --parallel --build-cache

      # ============================================================
      # 10. VERIFY GENERATED SIZES (TARGET: 2-4 MB)
      # ============================================================
      - name: Display Generated APK Sizes
        run: |
          echo "======================================"
          echo "GENERATED ULTRA-LIGHT APK SIZES:"
          ls -lh app/build/outputs/apk/release/*.apk
          echo "======================================"

      # ============================================================
      # 11. COMMIT AND PUSH ALL SOURCE FILES TO REPOSITORY
      # ============================================================
      - name: Push All Sources to Repository
        if: ${{ inputs.push_project == true }}
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected to push."
          else
            git commit -m "feat: Muslim Community dynamic library architecture [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
            echo "All dynamic project sources pushed to repository."
          fi

      # ============================================================
      # 12. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Ultra-Light APKs
        uses: actions/upload-artifact@v4
        with:
          name: MuslimCommunity-release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
