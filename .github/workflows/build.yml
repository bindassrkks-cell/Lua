name: Build, Commit Source & Release Core Native App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26, CMake, Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl coreutils gradle
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      # =========================================================================
      # 1. PURGE OLD PAK SYSTEM & SCAFFOLD COMPLETE NATIVE ARCHITECTURE
      # =========================================================================
