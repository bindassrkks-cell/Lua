name: Gemini Android Project Builder

on:
  workflow_dispatch:
    inputs:
      force_replace:
        description: "Replace existing Android project files"
        required: true
        default: "true"
        type: boolean

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "36"
  NDK_VERSION: "29.0.14206865"

jobs:
  generate-and-build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. CONFIGURE GIT
      # ============================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 3. CREATE BACKUP BRANCH
      # ============================================================
      - name: Backup current repository
        if: ${{ inputs.force_replace == true }}
        shell: bash
        run: |
          set -e

          CURRENT_BRANCH="${GITHUB_REF_NAME}"
          BACKUP_BRANCH="backup-before-gemini-${GITHUB_RUN_ID}"

          echo "Creating backup branch: $BACKUP_BRANCH"

          git checkout -b "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH" || true

          git checkout "$CURRENT_BRANCH"

      # ============================================================
      # 4. INSTALL JQ / CURL
      # ============================================================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl unzip

      # ============================================================
      # 5. GENERATE PROJECT USING GEMINI
      # ============================================================
      - name: Generate Android project with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          cat > /tmp/gemini_request.json <<'JSON'
          {
            "contents": [
              {
                "parts": [
                  {
                    "text": "You are an expert Android engineer and software architect. Generate a COMPLETE production-ready Android application project named MuslimCommunity. Use Kotlin, Jetpack Compose, Material 3, Gradle Kotlin DSL, Java 17, compileSdk 36, minSdk 24, targetSdk 36, Android NDK with CMake, and a small JNI C++ native layer. The UI must be handled by Jetpack Compose and Android application logic by Kotlin. NDK/C++ should only be used where native processing is appropriate and must be safely connected through JNI. Include a clean architecture with UI, ViewModel, repository, Supabase REST/realtime integration, authentication-ready architecture, storage-ready architecture, community posts, masjid data, quiz, Quran/Hadith sections, prayer-times architecture, profile, settings, dark/light theme, loading/error states, and offline-safe behavior. Do NOT put API keys or secrets in source code. Read Supabase URL and anon key from Gradle BuildConfig/environment-generated configuration. Include all required Gradle files, settings.gradle.kts, gradle.properties, libs.versions.toml if used, AndroidManifest.xml, Kotlin source files, resources, CMakeLists.txt, C++ JNI source, README.md, and Gradle wrapper configuration if possible. The project MUST compile on GitHub Actions Ubuntu 24.04. Avoid deprecated APIs where possible. Return ONLY valid JSON in exactly this format: {\"files\":[{\"path\":\"relative/path/to/file\",\"content\":\"complete file content\"}]}. Do not use markdown fences. Every file must contain complete content, not placeholders. Do not omit files required for compilation."
                  }
                ]
              }
            ],
            "generationConfig": {
              "temperature": 0.2,
              "responseMimeType": "application/json"
            }
          }
          JSON

          echo "Requesting project from Gemini..."

          curl --fail-with-body \
            -sS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/gemini_request.json \
            -o /tmp/gemini_response.json

          echo "Gemini response received."

          if ! jq empty /tmp/gemini_response.json >/dev/null 2>&1; then
            echo "Gemini returned invalid JSON."
            cat /tmp/gemini_response.json
            exit 1
          fi

          if jq -e '.error' /tmp/gemini_response.json >/dev/null 2>&1; then
            echo "Gemini API error:"
            jq '.error' /tmp/gemini_response.json
            exit 1
          fi

          jq -r '.candidates[0].content.parts[0].text' \
            /tmp/gemini_response.json > /tmp/project.json

          # Gemini can occasionally return a JSON string containing
          # escaped JSON. Decode it if necessary.
          if jq -e 'type == "string"' /tmp/project.json >/dev/null 2>&1; then
            jq -r '.' /tmp/project.json > /tmp/project-decoded.json
            mv /tmp/project-decoded.json /tmp/project.json
          fi

          if ! jq -e '.files and (.files | type == "array")' /tmp/project.json >/dev/null 2>&1; then
            echo "Gemini did not return the expected file map."
            cat /tmp/project.json
            exit 1
          fi

          FILE_COUNT=$(jq '.files | length' /tmp/project.json)

          if [ "$FILE_COUNT" -lt 5 ]; then
            echo "Too few files generated: $FILE_COUNT"
            exit 1
          fi

          echo "Gemini generated $FILE_COUNT files."

      # ============================================================
      # 6. REPLACE PROJECT FILES
      # ============================================================
      - name: Replace Android project
        if: ${{ inputs.force_replace == true }}
        shell: bash
        run: |
          set -e

          echo "Removing old generated project..."

          # Keep Git metadata and workflow configuration.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Writing Gemini-generated files..."

          jq -c '.files[]' /tmp/project.json | while IFS= read -r file; do

            PATH_NAME=$(echo "$file" | jq -r '.path')
            CONTENT=$(echo "$file" | jq -r '.content')

            # Prevent path traversal.
            case "$PATH_NAME" in
              /*|../*|*/../*|..)
                echo "Unsafe path rejected: $PATH_NAME"
                exit 1
                ;;
            esac

            mkdir -p "$(dirname "$PATH_NAME")"
            printf '%s' "$CONTENT" > "$PATH_NAME"

          done

          echo "Generated project files:"
          find . -not -path "./.git/*" -not -path "./.github/*" -type f | sort

      # ============================================================
      # 7. INSTALL JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 8. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"

      # ============================================================
      # 9. INJECT SUPABASE CONFIG
      # ============================================================
      - name: Create local build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_NDK_HOME
          EOF

          cat > .env.github <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF

          echo "Secrets prepared for build environment."

      # ============================================================
      # 10. FIND GRADLE WRAPPER
      # ============================================================
      - name: Check Gradle project
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew was not generated."

            echo "Attempting to install Gradle..."
            sudo apt-get update
            sudo apt-get install -y gradle

            if [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
              echo "No Gradle settings file found."
              exit 1
            fi

            gradle wrapper --gradle-version 8.13
          fi

          chmod +x ./gradlew

          echo "Gradle:"
          ./gradlew --version

      # ============================================================
      # 11. VALIDATE PROJECT
      # ============================================================
      - name: Validate Gradle project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks

      # ============================================================
      # 12. BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 13. BUILD RELEASE APK + AAB
      # ============================================================
      - name: Build release APK and AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease \
            bundleRelease

      # ============================================================
      # 14. SHOW OUTPUT
      # ============================================================
      - name: Show build outputs
        shell: bash
        run: |
          echo "=============================="
          echo "BUILD OUTPUTS"
          echo "=============================="

          find app/build/outputs \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # ============================================================
      # 15. COMMIT GENERATED PROJECT
      # ============================================================
      - name: Commit generated project
        shell: bash
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes."
            exit 0
          fi

          git commit \
            -m "Generate Muslim Community Android project with Gemini"

          git push origin "${GITHUB_REF_NAME}"

      # ============================================================
      # 16. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuslimCommunity-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 17. UPLOAD AAB
      # ============================================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MuslimCommunity-AAB
          path: |
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14