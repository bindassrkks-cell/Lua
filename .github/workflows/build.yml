      # =========================================================================
      # 4. GENERATE GRADLE WRAPPER & COMPILE APK
      # =========================================================================
      - name: Build Android Debug APK
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IslamicApp_0.0.15.0.apk

      # =========================================================================
      # 5. COMMIT FULL PROJECT & CONTENT STRUCTURE TO REPOSITORY
      # =========================================================================
      - name: Commit Scaffolding to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content app gradle gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties
          if ! git diff --staged --quiet; then
            git commit -m "chore: scaffold Android project & CorePatch content structure [skip ci]"
            # Agar workflow tag push par trigger hua ho to main branch par sync karega
            git push origin HEAD:main || git push origin main || true
          else
            echo "Working tree clean, nothing to commit."
          fi

      # =========================================================================
      # 6. PUBLISH EVERYTHING TO GITHUB RELEASES
      # =========================================================================
      - name: Publish CorePatch PAK & APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CorePatch & Islamic App 0.0.15.0
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.15.0' }}
          files: |
            dist/CorePatch_0.0.15.0.pak
            dist/SHA256SUMS
            dist/manifest.json
            dist/IslamicApp_0.0.15.0.apk
          body: |
            ### Islamic App Ecosystem Release (v0.0.15.0)
            
            #### 📦 Core Content Assets:
            - **`CorePatch_0.0.15.0.pak`**: Lua compiled binary container (WebP images, OGG, Lua, JSON).
            - **`manifest.json`**: OTA update definition with size and SHA-256 verification.
            - **`SHA256SUMS`**: Security digest for tamper verification.
            
            #### 📱 Application:
            - **`IslamicApp_0.0.15.0.apk`**: Pure Dark Material 3 Jetpack Compose app with real-time PAK hot-mounting.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
