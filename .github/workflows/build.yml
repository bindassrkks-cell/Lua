name: Zombie Battle Royale - Android Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

  ANDROID_ABI: "arm64-v8a"
  ANDROID_PLATFORM: "android-24"

  BUILD_TYPE: "Release"

  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dkotlin.daemon.jvm.options=-Xmx2g


jobs:

  # ============================================================
  # 1. CHECK PROJECT
  # ============================================================

  validate:
    name: Validate Game Project
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Show project
        shell: bash
        run: |
          set -eux

          echo "======================================"
          echo " PROJECT STRUCTURE"
          echo "======================================"

          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort | head -300

          echo
          echo "Disk:"
          df -h

      - name: Validate required files
        shell: bash
        run: |
          set -eux

          echo "Checking Android project..."

          test -f gradlew || {
            echo "::error::gradlew is missing"
            exit 1
          }

          test -f settings.gradle || \
          test -f settings.gradle.kts || {
            echo "::error::settings.gradle(.kts) is missing"
            exit 1
          }

          test -d android || {
            echo "::error::android/ directory is missing"
            exit 1
          }

          test -d engine || {
            echo "::error::engine/ directory is missing"
            exit 1
          }

          test -f engine/CMakeLists.txt || {
            echo "::error::engine/CMakeLists.txt is missing"
            exit 1
          }

          test -d game || {
            echo "::error::game/ directory is missing"
            exit 1
          }

          echo
          echo "Project validation: PASS"


  # ============================================================
  # 2. BUILD NATIVE C++ ENGINE
  # ============================================================

  native:
    name: Build C++ Engine - ARM64
    runs-on: ubuntu-latest
    needs: validate

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Configure Android NDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          echo "${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        shell: bash
        run: |
          set -eux

          java -version
          cmake --version

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"

          test -d "$ANDROID_NDK"

      # ----------------------------------------------------------
      # C++ ENGINE
      # ----------------------------------------------------------

      - name: Configure C++ Engine
        shell: bash
        run: |
          set -eux

          rm -rf build/native

          cmake \
            -S engine \
            -B build/native \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DANDROID_STL=c++_shared

      - name: Build C++ Engine
        shell: bash
        run: |
          set -eux

          cmake \
            --build build/native \
            --config "${BUILD_TYPE}" \
            --parallel "$(nproc)"

      - name: Verify native output
        shell: bash
        run: |
          set -eux

          echo "Native files:"

          find build/native \
            -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

          echo
          echo "Native build completed."

      - name: Upload native build
        uses: actions/upload-artifact@v7
        with:
          name: native-arm64
          path: |
            build/native/**
          if-no-files-found: error


  # ============================================================
  # 3. VALIDATE LUA + GAME ASSETS
  # ============================================================

  game-assets:
    name: Validate Lua and Game Assets
    runs-on: ubuntu-latest
    needs: validate

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lua
        shell: bash
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y lua5.4

          lua5.4 -v

      - name: Check Lua scripts
        shell: bash
        run: |
          set -eux

          if [ -d "game/scripts" ]; then

            echo "Checking Lua scripts..."

            find game/scripts \
              -type f \
              -name "*.lua" \
              -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking: $file"
              lua5.4 -e "assert(loadfile('$file'))"
            done

          else
            echo "::warning::game/scripts directory does not exist yet"
          fi

      - name: Check assets
        shell: bash
        run: |
          set -eux

          echo "Game asset summary:"

          if [ -d "game/assets" ]; then

            find game/assets -type f | wc -l

            du -sh game/assets || true

            echo
            echo "Large files:"
            find game/assets \
              -type f \
              -size +500M \
              -print || true

          else
            echo "::warning::game/assets directory does not exist yet"
          fi


  # ============================================================
  # 4. ANDROID APK
  # ============================================================

  android:
    name: Build Android APK - ARM64
    runs-on: ubuntu-latest

    needs:
      - validate
      - native
      - game-assets

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -eux

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Configure Android NDK
        shell: bash
        run: |
          set -eux

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

          echo "${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin" >> "$GITHUB_PATH"

      # ----------------------------------------------------------
      # Permissions
      # ----------------------------------------------------------

      - name: Fix Gradle permissions
        shell: bash
        run: |
          set -eux

          chmod +x gradlew

      # ----------------------------------------------------------
      # Project information
      # ----------------------------------------------------------

      - name: Android environment
        shell: bash
        run: |
          set -eux

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ./gradlew --version

          echo
          echo "SDK:"
          sdkmanager --list_installed | head -100

          echo
          echo "NDK:"
          ls -la "$ANDROID_NDK"

      # ----------------------------------------------------------
      # Clean build
      # ----------------------------------------------------------

      - name: Clean previous build
        shell: bash
        run: |
          set -eux

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      # ----------------------------------------------------------
      # Native + Android build
      # ----------------------------------------------------------

      - name: Build Release APK
        shell: bash
        env:
          ORG_GRADLE_PROJECT_android.useAndroidX: "true"
          ORG_GRADLE_PROJECT_android.enableJetifier: "false"
        run: |
          set -eux

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            assembleRelease

      # ----------------------------------------------------------
      # Verify APK
      # ----------------------------------------------------------

      - name: Find APK
        shell: bash
        run: |
          set -eux

          echo "APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK was generated"
            exit 1
          fi

          echo
          echo "APK count: $APK_COUNT"

      - name: Check APK architecture
        shell: bash
        run: |
          set -eux

          APK=$(find . \
            -type f \
            -name "*release*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            APK=$(find . \
              -type f \
              -name "*.apk" \
              | head -1)
          fi

          echo "APK:"
          echo "$APK"

          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            apk summary "$APK" || true

      # ----------------------------------------------------------
      # Rename APK
      # ----------------------------------------------------------

      - name: Prepare final APK
        shell: bash
        run: |
          set -eux

          mkdir -p release

          APK=$(find . \
            -type f \
            -name "*release*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            APK=$(find . \
              -type f \
              -name "*.apk" \
              | head -1)
          fi

          cp "$APK" \
            "release/ZombieBattleRoyale-arm64-release.apk"

          ls -lh release/

      # ----------------------------------------------------------
      # Upload final APK
      # ----------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ZombieBattleRoyale-Android-ARM64
          path: release/ZombieBattleRoyale-arm64-release.apk
          if-no-files-found: error
          retention-days: 14

      # ----------------------------------------------------------
      # Build report
      # ----------------------------------------------------------

      - name: Build report
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " ZOMBIE BATTLE ROYALE BUILD REPORT"
          echo "=========================================="

          echo "ABI:        ${ANDROID_ABI}"
          echo "API:        ${ANDROID_API}"
          echo "NDK:        ${NDK_VERSION}"
          echo "CMake:      ${CMAKE_VERSION}"
          echo "Build:      ${BUILD_TYPE}"

          echo
          echo "Disk:"
          df -h

          echo
          echo "APK:"
          ls -lh release/ 2>/dev/null || true