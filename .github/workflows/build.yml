              onSurface = TextPureWhite
          )

          @Composable
          fun IslamicAppTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = DarkColorScheme, content = content)
          }
          EOF

          # PAK Binary Reader
          cat << 'EOF' > app/src/main/java/com/islamic/app/pak/PakReader.kt
          package com.islamic.app.pak

          import java.io.File
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.security.MessageDigest

          data class PakEntry(
              val path: String, val contentType: Byte, val offset: Long,
              val size: Long, val compType: Byte, val sha256: ByteArray
          )

          class PakReader(val file: File) : AutoCloseable {
              private val raf = RandomAccessFile(file, "r")
              val entries = HashMap<String, PakEntry>()

              init {
                  require(file.length() >= 64) { "Invalid PAK size." }
                  raf.seek(0)
                  val headerBuf = ByteArray(64)
                  raf.readFully(headerBuf)
                  val bb = ByteBuffer.wrap(headerBuf).order(ByteOrder.BIG_ENDIAN)

                  val magic = ByteArray(4)
                  bb.get(magic)
                  if (String(magic, Charsets.US_ASCII) != "ISPK") throw SecurityException("Invalid PAK Magic")

                  val fmtVer = bb.short
                  val flags = bb.short
                  val contentVersion = bb.int
                  val fileCount = bb.int
                  val indexOffset = bb.long
                  val indexSize = bb.long
                  val indexSha256 = ByteArray(32)
                  bb.get(indexSha256)

                  raf.seek(indexOffset)
                  val indexBuf = ByteArray(indexSize.toInt())
                  raf.readFully(indexBuf)

                  val md = MessageDigest.getInstance("SHA-256")
                  if (!md.digest(indexBuf).contentEquals(indexSha256)) throw SecurityException("Corrupted PAK index")

                  val idxBb = ByteBuffer.wrap(indexBuf).order(ByteOrder.BIG_ENDIAN)
                  for (i in 0 until fileCount) {
                      val pathLen = idxBb.short.toInt() and 0xFFFF
                      val pathBytes = ByteArray(pathLen)
                      idxBb.get(pathBytes)
                      val path = String(pathBytes, Charsets.UTF_8)
                      val ctype = idxBb.get()
                      val offset = idxBb.long
                      val compSize = idxBb.long
                      val origSize = idxBb.long
                      val compType = idxBb.get()
                      val fileSha = ByteArray(32)
                      idxBb.get(fileSha)
                      entries[path] = PakEntry(path, ctype, offset, compSize, compType, fileSha)
                  }
              }

              fun exists(path: String) = entries.containsKey(path)

              @Synchronized
              fun readBytes(path: String): ByteArray {
                  val entry = entries[path] ?: throw NoSuchElementException("Path not found: $path")
                  raf.seek(entry.offset)
                  val payload = ByteArray(entry.size.toInt())
                  raf.readFully(payload)
                  return payload
              }

              fun readText(path: String) = String(readBytes(path), Charsets.UTF_8)
              override fun close() = raf.close()
          }
          EOF

          # PAK Manager
          cat << 'EOF' > app/src/main/java/com/islamic/app/pak/PakManager.kt
          package com.islamic.app.pak

          import android.content.Context
          import android.util.LruCache
          import java.io.File

          object PakManager {
              private val mountedPaks = mutableListOf<PakReader>()
              private val memoryCache = LruCache<String, ByteArray>(15 * 1024 * 1024)

              fun init(context: Context) {
                  val dir = getPakDirectory(context)
                  if (!dir.exists()) dir.mkdirs()
                  refreshMountedPackages(context)
              }

              fun getPakDirectory(context: Context) = File(context.filesDir, "content/pak")

              @Synchronized
              fun refreshMountedPackages(context: Context) {
                  closeAll()
                  val dir = getPakDirectory(context)
                  val paks = dir.listFiles { f -> f.isFile && f.extension == "pak" } ?: emptyArray()
                  for (f in paks.sortedBy { it.name }) {
                      try { mountedPaks.add(PakReader(f)) } catch (e: Exception) { e.printStackTrace() }
                  }
              }

              @Synchronized
              fun exists(path: String) = mountedPaks.any { it.exists(path) }

              @Synchronized
              fun readBytes(path: String): ByteArray {
                  val cached = memoryCache.get(path)
                  if (cached != null) return cached
                  for (pak in mountedPaks) {
                      if (pak.exists(path)) {
                          val data = pak.readBytes(path)
                          memoryCache.put(path, data)
                          return data
                      }
                  }
                  throw NoSuchElementException("Asset missing: $path")
              }

              fun readText(path: String) = String(readBytes(path), Charsets.UTF_8)

              @Synchronized
              fun closeAll() {
                  memoryCache.evictAll()
                  mountedPaks.forEach { it.close() }
                  mountedPaks.clear()
              }
          }
          EOF

          # PakDownloader
          cat << 'EOF' > app/src/main/java/com/islamic/app/downloader/PakDownloader.kt
          package com.islamic.app.downloader

          import android.content.Context
          import com.islamic.app.pak.PakManager
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.flow
          import kotlinx.coroutines.flow.flowOn
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.security.MessageDigest

          sealed class UpdateState {
              object Idle : UpdateState()
              object Checking : UpdateState()
              data class Progress(val percentage: Int) : UpdateState()
              data class Completed(val message: String) : UpdateState()
              data class Error(val error: String) : UpdateState()
          }

          class PakDownloader(private val context: Context) {
              private val client = OkHttpClient()
              private val manifestUrl = "https://github.com/bindassrkks-cell/Lua/releases/download/main/manifest.json"
              private val pakBaseUrl = "https://github.com/bindassrkks-cell/Lua/releases/download/main/CorePatch_0.0.15.0.pak"

              fun syncCorePatch(): Flow<UpdateState> = flow {
                  emit(UpdateState.Checking)
                  val manifestRequest = Request.Builder().url(manifestUrl).build()
                  val manifestResponse = client.newCall(manifestRequest).execute()

                  if (!manifestResponse.isSuccessful) {
                      emit(UpdateState.Error("HTTP Error: ${manifestResponse.code}"))
                      return@flow
                  }

                  val jsonStr = manifestResponse.body?.string().orEmpty()
                  val manifestObj = JSONObject(jsonStr)
                  val pkg = manifestObj.getJSONArray("packages").getJSONObject(0)
                  val fileName = pkg.getString("file_name")
                  val expectedSha = pkg.getString("sha256")

                  val targetDir = PakManager.getPakDirectory(context)
                  val targetFile = File(targetDir, fileName)
                  val partFile = File(targetDir, "$fileName.part")

                  val pakResponse = client.newCall(Request.Builder().url(pakBaseUrl).build()).execute()
                  val body = pakResponse.body ?: run {
                      emit(UpdateState.Error("Empty payload"))
                      return@flow
                  }

                  val totalSize = body.contentLength()
                  val input = body.byteStream()
                  val output = FileOutputStream(partFile)
                  val buffer = ByteArray(8192)
                  var read: Int
                  var downloaded = 0L

                  try {
                      while (input.read(buffer).also { read = it } != -1) {
                          output.write(buffer, 0, read)
                          downloaded += read
                          emit(UpdateState.Progress(if (totalSize > 0) ((downloaded * 100) / totalSize).toInt() else 0))
                      }
                      output.flush()
                  } finally {
                      output.close()
                      input.close()
                  }

                  val md = MessageDigest.getInstance("SHA-256")
                  val calculatedSha = md.digest(partFile.readBytes()).joinToString("") { "%02x".format(it) }

                  if (!calculatedSha.equals(expectedSha, ignoreCase = true)) {
                      partFile.delete()
                      emit(UpdateState.Error("SHA-256 check failed"))
                      return@flow
                  }

                  if (targetFile.exists()) targetFile.delete()
                  if (partFile.renameTo(targetFile)) {
                      PakManager.refreshMountedPackages(context)
                      emit(UpdateState.Completed("CorePatch 0.0.15.0 Active"))
                  } else {
                      emit(UpdateState.Error("Mount failed"))
                  }
              }.flowOn(Dispatchers.IO)
          }
          EOF

          # PakImage UI Component
          cat << 'EOF' > app/src/main/java/com/islamic/app/ui/components/PakImage.kt
          package com.islamic.app.ui.components

          import android.graphics.BitmapFactory
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Mosque
          import androidx.compose.material3.Icon
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.unit.dp
          import com.islamic.app.pak.PakManager
          import com.islamic.app.ui.theme.DarkCardBorder
          import com.islamic.app.ui.theme.MintSecondary
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          @Composable
          fun PakImage(path: String, contentDescription: String?, modifier: Modifier = Modifier) {
              var bitmap by remember(path) { mutableStateOf<android.graphics.Bitmap?>(null) }
              LaunchedEffect(path) {
                  withContext(Dispatchers.IO) {
                      try {
                          if (PakManager.exists(path)) {
                              val bytes = PakManager.readBytes(path)
                              bitmap = BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                          }
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }
              if (bitmap != null) {
