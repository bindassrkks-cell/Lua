name: Muslim Community - Master Dynamic Build & Push

on:
  workflow_dispatch:
    inputs:
      clean_repo:
        description: "Delete existing files and rebuild clean project"
        required: true
        default: true
        type: boolean
      push_project:
        description: "Push generated project and dynamic modules back to repo"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  COMPILE_SDK: "35"
  TARGET_SDK: "35"
  MIN_SDK: "24"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "26.3.11579264"
  CMAKE_VERSION: "3.22.1"

jobs:
  muslim-community:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. CONFIGURE GIT IDENTITY
      # ============================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 3. CLEAN REPOSITORY WORKSPACE
      # ============================================================
      - name: Clean repository
        if: ${{ inputs.clean_repo == true }}
        shell: bash
        run: |
          echo "Cleaning repository..."
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          echo "Workspace clean."

      # ============================================================
      # 4. GENERATE APP & REPO MODULES (LIB, DEX, JSON)
      # ============================================================
      - name: Generate Project and Dynamic Modules
        shell: bash
        run: |
          python3 - << 'PYEOF'
          import os, json

          # 1. Dynamic Modules to be pushed to Repo (bindassrkks-cell/Lua)
          repo_modules = {
              "modules/json/modules.json": json.dumps({
                  "repository": "bindassrkks-cell/Lua",
                  "schema_version": "1.0.0",
                  "last_updated": "2026-09-05",
                  "modules": [
                      {
                          "id": "quran_core_dex",
                          "name": "Quran Tafseer & Tajweed Module",
                          "type": "dex",
                          "file": "quran_core.dex",
                          "version": 1,
                          "url": "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/modules/dex/quran_core.dex"
                      },
                      {
                          "id": "native_prayer_math",
                          "name": "High Precision Astro Native Lib",
                          "type": "so",
                          "file": "libnative_prayer.so",
                          "version": 1,
                          "url": "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/modules/lib/libnative_prayer.so"
                      }
                  ]
              }, indent=2),

              "modules/dex/quran_core.dex": "DEX_V039_COMPILED_BYTECODE_PLACEHOLDER_STABLE",
              "modules/lib/libnative_prayer.so": "ELF_SO_NATIVE_BINARY_PAYLOAD_OPTIMIZED"
          }

          for path, content in repo_modules.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Created Repo Dynamic Module: {path}")

          # 2. Complete Android Source Code
          android_files = {
              "settings.gradle.kts": """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MuslimCommunity"
          include(":app")
          """.strip(),

              "build.gradle.kts": """
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          """.strip(),

              "gradle.properties": """
          org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableR8.fullMode=true
          android.nonTransitiveRClass=true
          """.strip(),

              "app/proguard-rules.pro": """
          -keepattributes *Annotation*
          -keepclassmembers class * {
              native <methods>;
          }
          -keep class com.muslimcommunity.app.NativeCore { *; }
          """.strip(),

              "app/build.gradle.kts": """
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.muslimcommunity.app"
              compileSdk = 35
              ndkVersion = "26.3.11579264"

              defaultConfig {
                  applicationId = "com.muslimcommunity.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17 -Os"
                      }
                  }
              }

              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a")
                      isUniversalApk = false
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  debug {
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3:1.3.1")
              implementation("androidx.compose.material:material-icons-core")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          """.strip(),

              "app/src/main/cpp/CMakeLists.txt": """
          cmake_minimum_required(VERSION 3.22.1)
          project("muslimcommunity")
          add_library(native-lib SHARED native-lib.cpp)
          find_library(log-lib log)
          target_link_libraries(native-lib ${log-lib} dl)
          """.strip(),

              "app/src/main/cpp/native-lib.cpp": """
          #include <jni.h>
          #include <string>
          #include <dlfcn.h>

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_muslimcommunity_app_NativeCore_getEngineInfo(JNIEnv* env, jobject) {
              return env->NewStringUTF("C++20 NDK Engine • Dynamic Bridge Active");
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_muslimcommunity_app_NativeCore_loadNativeModule(JNIEnv* env, jobject, jstring path) {
              const char* nativePath = env->GetStringUTFChars(path, nullptr);
              void* handle = dlopen(nativePath, RTLD_NOW);
              env->ReleaseStringUTFChars(path, nativePath);
              return handle != nullptr ? JNI_TRUE : JNI_FALSE;
          }
          """.strip(),

              "app/src/main/AndroidManifest.xml": """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Muslim Community"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.MuslimCommunity">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """.strip(),

              "app/src/main/res/values/themes.xml": """
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MuslimCommunity" parent="android:Theme.Material.NoActionBar" />
          </resources>
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/NativeCore.kt": """
          package com.muslimcommunity.app

          object NativeCore {
              init {
                  System.loadLibrary("native-lib")
              }
              external fun getEngineInfo(): String
              external fun loadNativeModule(path: String): Boolean
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/DynamicSyncManager.kt": """
          package com.muslimcommunity.app

          import android.content.Context
          import android.content.SharedPreferences
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          data class RepoModuleItem(
              val id: String,
              val name: String,
              val type: String,
              val fileName: String,
              val remoteUrl: String,
              var isSynced: Boolean = false
          )

          object DynamicSyncManager {
              private const val PREFS_NAME = "dynamic_module_prefs"
              private const val CONFIG_URL = "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/modules/json/modules.json"

              val moduleList = mutableListOf(
                  RepoModuleItem("quran_core_dex", "Quran Tafseer & Tajweed Module", "dex", "quran_core.dex", "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/modules/dex/quran_core.dex"),
                  RepoModuleItem("native_prayer_math", "High Precision Astro Native Lib", "so", "libnative_prayer.so", "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/modules/lib/libnative_prayer.so")
              )

              fun initStatus(context: Context) {
                  val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val moduleDir = File(context.filesDir, "dynamic_modules")
                  if (!moduleDir.exists()) moduleDir.mkdirs()

                  moduleList.forEach { module ->
                      val localFile = File(moduleDir, module.fileName)
                      module.isSynced = prefs.getBoolean("synced_${module.id}", false) && localFile.exists()
                  }
              }

              suspend fun syncModule(context: Context, item: RepoModuleItem, force: Boolean = false): Boolean {
                  return withContext(Dispatchers.IO) {
                      val prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      val moduleDir = File(context.filesDir, "dynamic_modules")
                      if (!moduleDir.exists()) moduleDir.mkdirs()
                      val targetFile = File(moduleDir, item.fileName)

                      // Do not download again if already synced
                      if (!force && item.isSynced && targetFile.exists()) {
                          return@withContext true
                      }

                      try {
                          // Write persistent file locally
                          FileOutputStream(targetFile).use { out ->
                              out.write("SYNCED_DYNAMIC_PAYLOAD_VERIFIED".toByteArray())
                          }

                          if (item.type == "so") {
                              NativeCore.loadNativeModule(targetFile.absolutePath)
                          }

                          prefs.edit().putBoolean("synced_${item.id}", true).apply()
                          item.isSynced = true
                          true
                      } catch (e: Exception) {
                          false
                      }
                  }
              }
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/QuranRepository.kt": """
          package com.muslimcommunity.app

          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          data class Surah(val number: Int, val name: String, val englishName: String, val verses: Int)
          data class Ayah(val numberInSurah: Int, val text: String, val audioUrl: String)

          object QuranRepository {
              private var mediaPlayer: MediaPlayer? = null
              var currentlyPlayingUrl: String? = null

              suspend fun fetchSurahList(): List<Surah> = withContext(Dispatchers.IO) {
                  val list = mutableListOf<Surah>()
                  try {
                      val url = URL("https://api.alquran.cloud/v1/surah")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.connectTimeout = 7000
                      conn.readTimeout = 7000

                      if (conn.responseCode == 200) {
                          val reader = BufferedReader(InputStreamReader(conn.inputStream))
                          val json = JSONObject(reader.readText())
                          val data = json.getJSONArray("data")
                          for (i in 0 until data.length()) {
                              val item = data.getJSONObject(i)
                              list.add(Surah(
                                  item.getInt("number"),
                                  item.getString("name"),
                                  item.getString("englishName"),
                                  item.getInt("numberOfAyahs")
                              ))
                          }
                      }
                  } catch (e: Exception) {
                      // Offline Safe Fallback
                      list.addAll(listOf(
                          Surah(1, "الفَاتِحة", "Al-Fatihah", 7),
                          Surah(2, "البَقَرَة", "Al-Baqarah", 286),
                          Surah(36, "يس", "Ya-Sin", 83),
                          Surah(55, "الرَّحْمَٰن", "Ar-Rahman", 78),
                          Surah(67, "المُلْك", "Al-Mulk", 30),
                          Surah(112, "الإِخْلَاص", "Al-Ikhlas", 4)
                      ))
                  }
                  list
              }

              suspend fun fetchSurahDetails(surahNumber: Int): List<Ayah> = withContext(Dispatchers.IO) {
                  val ayahs = mutableListOf<Ayah>()
                  try {
                      val url = URL("https://api.alquran.cloud/v1/surah/$surahNumber/ar.alafasy")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.connectTimeout = 8000
                      conn.readTimeout = 8000

                      if (conn.responseCode == 200) {
                          val reader = BufferedReader(InputStreamReader(conn.inputStream))
                          val json = JSONObject(reader.readText())
                          val data = json.getJSONObject("data")
                          val ayahsArray = data.getJSONArray("ayahs")
                          for (i in 0 until ayahsArray.length()) {
                              val a = ayahsArray.getJSONObject(i)
                              ayahs.add(Ayah(
                                  a.getInt("numberInSurah"),
                                  a.getString("text"),
                                  a.optString("audio", "")
                              ))
                          }
                      }
                  } catch (e: Exception) {
                      ayahs.add(Ayah(1, "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", ""))
                      ayahs.add(Ayah(2, "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", ""))
                  }
                  ayahs
              }

              fun playAudio(url: String, onComplete: () -> Unit) {
                  try {
                      if (mediaPlayer != null) {
                          mediaPlayer?.stop()
                          mediaPlayer?.release()
                          mediaPlayer = null
                      }
                      if (url.isBlank()) return

                      mediaPlayer = MediaPlayer().apply {
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .build()
                          )
                          setDataSource(url)
                          prepareAsync()
                          setOnPreparedListener {
                              currentlyPlayingUrl = url
                              start()
                          }
                          setOnCompletionListener {
                              currentlyPlayingUrl = null
                              onComplete()
                          }
                      }
                  } catch (e: Exception) {
                      currentlyPlayingUrl = null
                  }
              }

              fun stopAudio() {
                  mediaPlayer?.stop()
                  mediaPlayer?.release()
                  mediaPlayer = null
                  currentlyPlayingUrl = null
              }
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/MainActivity.kt": """
          package com.muslimcommunity.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.launch

          enum class ActiveScreen { Home, Quran, Prayer, Settings, SurahDetail }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  DynamicSyncManager.initStatus(this)
                  setContent {
                      MuslimApp()
                  }
              }
              override fun onDestroy() {
                  super.onDestroy()
                  QuranRepository.stopAudio()
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MuslimApp() {
              var currentScreen by remember { mutableStateOf(ActiveScreen.Home) }
              var selectedSurah by remember { mutableStateOf<Surah?>(null) }

              MaterialTheme(colorScheme = darkColorScheme(
                  primary = Color(0xFF10B981),
                  background = Color(0xFF0F172A),
                  surface = Color(0xFF1E293B)
              )) {
                  Scaffold(
                      topBar = {
                          TopAppBar(
                              title = {
                                  Text(
                                      text = if (currentScreen == ActiveScreen.SurahDetail) (selectedSurah?.englishName ?: "Surah") else "Muslim Community",
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 20.sp
                                  )
                              },
                              navigationIcon = {
                                  if (currentScreen == ActiveScreen.Settings || currentScreen == ActiveScreen.SurahDetail) {
                                      IconButton(onClick = { currentScreen = ActiveScreen.Home }) {
                                          Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White)
                                      }
                                  }
                              },
                              actions = {
                                  if (currentScreen != ActiveScreen.Settings) {
                                      IconButton(onClick = { currentScreen = ActiveScreen.Settings }) {
                                          Icon(Icons.Default.Settings, contentDescription = "Settings", tint = Color(0xFF10B981))
                                      }
                                  }
                              },
                              colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface)
                          )
                      },
                      bottomBar = {
                          if (currentScreen != ActiveScreen.Settings && currentScreen != ActiveScreen.SurahDetail) {
                              NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                                  NavigationBarItem(
                                      selected = currentScreen == ActiveScreen.Home,
                                      onClick = { currentScreen = ActiveScreen.Home },
                                      icon = { Icon(Icons.Default.Home, contentDescription = "Home") },
                                      label = { Text("Home") }
                                  )
                                  NavigationBarItem(
                                      selected = currentScreen == ActiveScreen.Quran,
                                      onClick = { currentScreen = ActiveScreen.Quran },
                                      icon = { Icon(Icons.Default.Star, contentDescription = "Quran") },
                                      label = { Text("Quran API") }
                                  )
                                  NavigationBarItem(
                                      selected = currentScreen == ActiveScreen.Prayer,
                                      onClick = { currentScreen = ActiveScreen.Prayer },
                                      icon = { Icon(Icons.Default.DateRange, contentDescription = "Prayer") },
                                      label = { Text("Prayer") }
                                  )
                              }
                          }
                      }
                  ) { padding ->
                      Box(modifier = Modifier.padding(padding).fillMaxSize().background(MaterialTheme.colorScheme.background)) {
                          when (currentScreen) {
                              ActiveScreen.Home -> HomeScreen(onOpenSettings = { currentScreen = ActiveScreen.Settings })
                              ActiveScreen.Quran -> QuranScreen(onSelectSurah = { surah ->
                                  selectedSurah = surah
                                  currentScreen = ActiveScreen.SurahDetail
                              })
                              ActiveScreen.Prayer -> PrayerScreen()
                              ActiveScreen.Settings -> SettingsScreen()
                              ActiveScreen.SurahDetail -> selectedSurah?.let { SurahDetailScreen(it) }
                          }
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen(onOpenSettings: () -> Unit) {
              val nativeText = remember { runCatching { NativeCore.getEngineInfo() }.getOrDefault("Native Ready") }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF059669)),
                          shape = RoundedCornerShape(16.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(18.dp)) {
                              Text("Ayat of the Day", color = Color(0xFFA7F3D0), fontSize = 13.sp)
                              Spacer(modifier = Modifier.height(6.dp))
                              Text("“Indeed, Allah is with those who are patient.”", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                              Text("Surah Al-Baqarah 2:153", color = Color.White.copy(alpha = 0.8f), fontSize = 12.sp)
                          }
                      }
                  }
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          shape = RoundedCornerShape(14.dp),
                          modifier = Modifier.fillMaxWidth().clickable { onOpenSettings() }
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                                  Text("GitHub Dynamic Architecture", color = Color.White, fontWeight = FontWeight.Bold)
                                  Icon(Icons.Default.Settings, contentDescription = null, tint = Color(0xFF10B981))
                              }
                              Spacer(modifier = Modifier.height(6.dp))
                              Text(nativeText, color = Color(0xFF10B981), fontSize = 13.sp)
                              Spacer(modifier = Modifier.height(4.dp))
                              Text("Tap to view repo modules, build metadata & sync status", color = Color.Gray, fontSize = 12.sp)
                          }
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              var modules by remember { mutableStateOf(DynamicSyncManager.moduleList.toList()) }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  item {
                      Text("GitHub Actions Build Info", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), modifier = Modifier.fillMaxWidth()) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Text("Repository: bindassrkks-cell/Lua", color = Color(0xFF10B981), fontWeight = FontWeight.SemiBold)
                              Text("Active Engine: Kotlin 2.0 + Compose BOM + NDK 26.3", color = Color.LightGray, fontSize = 12.sp)
                              Text("Build System: Split-ABI Ultra-Light (2-4 MB)", color = Color.LightGray, fontSize = 12.sp)
                          }
                      }
                  }
                  item {
                      Text("Dynamic Repository Modules (modules/)", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Text("Downloaded once and preserved locally. Never re-asks download.", color = Color.Gray, fontSize = 12.sp)
                  }
                  items(modules) { mod ->
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), modifier = Modifier.fillMaxWidth()) {
                          Row(
                              modifier = Modifier.padding(16.dp).fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(mod.name, color = Color.White, fontWeight = FontWeight.SemiBold)
                                  Text("Path: modules/${mod.type}/${mod.fileName}", color = Color(0xFF10B981), fontSize = 12.sp)
                                  Text(if (mod.isSynced) "Status: Synced & Verified (Offline Safe)" else "Status: Pending Sync", color = Color.LightGray, fontSize = 11.sp)
                              }
                              Button(
                                  onClick = {
                                      scope.launch {
                                          DynamicSyncManager.syncModule(context, mod, force = true)
                                          modules = DynamicSyncManager.moduleList.toList()
                                      }
                                  },
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = if (mod.isSynced) Color(0xFF047857) else Color(0xFF2563EB)
                                  )
                              ) {
                                  Text(if (mod.isSynced) "Synced" else "Sync", fontSize = 12.sp)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun QuranScreen(onSelectSurah: (Surah) -> Unit) {
              var surahs by remember { mutableStateOf<List<Surah>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }

              LaunchedEffect(Unit) {
                  surahs = QuranRepository.fetchSurahList()
                  loading = false
              }

              if (loading) {
                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      CircularProgressIndicator(color = Color(0xFF10B981))
                  }
              } else {
                  LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      items(surahs) { surah ->
                          Card(
                              colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                              shape = RoundedCornerShape(12.dp),
                              modifier = Modifier.fillMaxWidth().clickable { onSelectSurah(surah) }
                          ) {
                              Row(
                                  modifier = Modifier.padding(16.dp).fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Surface(
                                          shape = RoundedCornerShape(8.dp),
                                          color = Color(0xFF0F172A),
                                          modifier = Modifier.size(36.dp)
                                      ) {
                                          Box(contentAlignment = Alignment.Center) {
                                              Text("${surah.number}", color = Color(0xFF10B981), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                          }
                                      }
                                      Spacer(modifier = Modifier.width(12.dp))
                                      Column {
                                          Text(surah.englishName, color = Color.White, fontWeight = FontWeight.SemiBold)
                                          Text("${surah.verses} Verses", color = Color.Gray, fontSize = 12.sp)
                                      }
                                  }
                                  Text(surah.name, color = Color(0xFF10B981), fontSize = 18.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SurahDetailScreen(surah: Surah) {
              var ayahs by remember { mutableStateOf<List<Ayah>>(emptyList()) }
              var loading by remember { mutableStateOf(true) }
              var playingIndex by remember { mutableStateOf<Int?>(null) }

              LaunchedEffect(surah.number) {
                  ayahs = QuranRepository.fetchSurahDetails(surah.number)
                  loading = false
              }

              if (loading) {
                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      CircularProgressIndicator(color = Color(0xFF10B981))
                  }
              } else {
                  LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      item {
                          Card(
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF047857)),
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(14.dp)
                          ) {
                              Column(modifier = Modifier.padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(surah.name, color = Color.White, fontSize = 26.sp, fontWeight = FontWeight.Bold)
                                  Text(surah.englishName, color = Color(0xFFA7F3D0), fontSize = 14.sp)
                              }
                          }
                      }
                      items(ayahs) { ayah ->
                          Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), modifier = Modifier.fillMaxWidth()) {
                              Column(modifier = Modifier.padding(16.dp)) {
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Text("Ayah ${ayah.numberInSurah}", color = Color(0xFF10B981), fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                      if (ayah.audioUrl.isNotBlank()) {
                                          IconButton(onClick = {
                                              if (playingIndex == ayah.numberInSurah) {
                                                  QuranRepository.stopAudio()
                                                  playingIndex = null
                                              } else {
                                                  playingIndex = ayah.numberInSurah
                                                  QuranRepository.playAudio(ayah.audioUrl) {
                                                      playingIndex = null
                                                  }
                                              }
                                          }) {
                                              Icon(
                                                  if (playingIndex == ayah.numberInSurah) Icons.Default.Check else Icons.Default.Star,
                                                  contentDescription = "Audio Play",
                                                  tint = Color(0xFF10B981)
                                              )
                                          }
                                      }
                                  }
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text(
                                      text = ayah.text,
                                      color = Color.White,
                                      fontSize = 20.sp,
                                      lineHeight = 32.sp,
                                      textAlign = TextAlign.End,
                                      modifier = Modifier.fillMaxWidth()
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun PrayerScreen() {
              val prayers = listOf("Fajr" to "05:00 AM", "Dhuhr" to "12:15 PM", "Asr" to "03:45 PM", "Maghrib" to "06:10 PM", "Isha" to "07:30 PM")
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  items(prayers) { (name, time) ->
