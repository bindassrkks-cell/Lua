          PYEOF

      # ============================================================
      # 5. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================================
      # 6. SETUP ANDROID SDK & NDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

      # ============================================================
      # 7. CONFIGURE LOCAL.PROPERTIES
      # ============================================================
      - name: Configure local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          EOF

      # ============================================================
      # 8. SETUP GRADLE WRAPPER
      # ============================================================
      - name: Setup Gradle Wrapper
        run: |
          curl -sLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
          chmod +x ./gradlew
          rm -rf /tmp/gradle*

      # ============================================================
      # 9. COMPILE FAST ULTRA-LIGHT APK
      # ============================================================
      - name: Compile Ultra-Light APKs
        run: |
          ./gradlew assembleRelease --no-daemon --parallel --build-cache

      # ============================================================
      # 10. VERIFY OUTPUT SIZES (2-4 MB)
      # ============================================================
      - name: Display Output APK Sizes
        run: |
          echo "======================================"
          echo "BUILT ULTRA-LIGHT WASM APKS:"
          ls -lh app/build/outputs/apk/release/*.apk
          echo "======================================"

      # ============================================================
      # 11. COMMIT & PUSH APP + WASM FEED TO GITHUB REPO
      # ============================================================
      - name: Push All Sources & Wasm Feed to Repo
        if: ${{ inputs.push_project == true }}
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: iOS Wasm Engine, Ayat Tab & GitHub JSON Live Sync [skip ci]"
            git push origin "${GITHUB_REF_NAME}"
            echo "Successfully pushed Wasm feed and project to repository."
          fi

      # ============================================================
      # 12. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Ultra-Light APKs
        uses: actions/upload-artifact@v4
        with:
          name: MuslimCommunity-wasm-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
