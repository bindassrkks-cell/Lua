name: Zombie Battle Royale - Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

  ANDROID_ABI: "arm64-v8a"
  MIN_SDK: "24"
  TARGET_SDK: "36"

  GRADLE_VERSION: "9.3.1"
  AGP_VERSION: "9.1.1"

  BUILD_TYPE: "Release"

  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx4g

jobs:

  # ============================================================
  # 1. PREPARE PROJECT
  # ============================================================

  prepare:
    name: Prepare Game Project
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Show repository
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          pwd

          echo
          echo "Files:"
          find . \
            -maxdepth 3 \
            -type f \
            ! -path "./.git/*" \
            | sort \
            | head -500

          echo
          echo "Disk:"
          df -h

      # --------------------------------------------------------
      # Create project directories if missing
      # --------------------------------------------------------

      - name: Create project structure
        shell: bash
        run: |
          set -eux

          mkdir -p \
            android/app/src/main/java/com/zbr/game \
            android/app/src/main/res/values \
            android/app/src/main/cpp \
            android/app/src/main/jniLibs/arm64-v8a \
            engine/src \
            engine/include \
            game/scripts \
            game/assets

      # --------------------------------------------------------
      # Android settings
      # --------------------------------------------------------

      - name: Generate Android settings
        shell: bash
        run: |
          set -eux

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ZombieBattleRoyale"

          include(":app")
          project(":app").projectDir = file("android/app")
          EOF

      # --------------------------------------------------------
      # Root Gradle
      # --------------------------------------------------------

      - name: Generate root build.gradle.kts
        shell: bash
        run: |
          set -eux

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

      # --------------------------------------------------------
      # Gradle properties
      # --------------------------------------------------------

      - name: Generate gradle.properties
        shell: bash
        run: |
          set -eux

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true

          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # --------------------------------------------------------
      # Android module
      # --------------------------------------------------------

      - name: Generate Android app build.gradle.kts
        shell: bash
        run: |
          set -eux

          cat > android/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.zbr.game"

              compileSdk = 36

              ndkVersion = "28.2.13676358"

              defaultConfig {
                  applicationId = "com.zbr.game"

                  minSdk = 24
                  targetSdk = 36

                  versionCode = 1
                  versionName = "0.1.0"

                  ndk {
                      abiFilters += "arm64-v8a"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false

                      proguardFiles(
                          getDefaultProguardFile(
                              "proguard-android-optimize.txt"
                          ),
                          "proguard-rules.pro"
                      )
                  }

                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.31.6"
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = false
                  }

                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
          }
          EOF

      - name: Generate ProGuard
        shell: bash
        run: |
          set -eux

          cat > android/app/proguard-rules.pro <<'EOF'
          # Native engine
          -keep class com.zbr.game.** { *; }
          EOF

      # --------------------------------------------------------
      # Android Manifest
      # --------------------------------------------------------

      - name: Generate AndroidManifest.xml
        shell: bash
        run: |
          set -eux

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.vulkan.version"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.opengles.aep"
                  android:required="false" />

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Zombie Battle Royale"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:resizeableActivity="false">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # --------------------------------------------------------
      # Theme
      # --------------------------------------------------------

      - name: Generate Android theme
        shell: bash
        run: |
          set -eux

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#FF0000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>

              </style>

          </resources>
          EOF

      # ========================================================
      # C++ ENGINE
      # ========================================================

      - name: Generate C++ engine CMake
        shell: bash
        run: |
          set -eux

          cat > engine/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)

          project(ZombieBattleRoyaleEngine)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          add_library(
              zbr_engine
              SHARED
              src/Engine.cpp
          )

          target_include_directories(
              zbr_engine
              PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}/include
          )

          find_library(
              log-lib
              log
          )

          find_library(
              android-lib
              android
          )

          target_link_libraries(
              zbr_engine
              ${log-lib}
              ${android-lib}
          )

          set_target_properties(
              zbr_engine
              PROPERTIES
              OUTPUT_NAME "zbr_engine"
          )
          EOF

      - name: Generate C++ engine
        shell: bash
        run: |
          set -eux

          cat > engine/src/Engine.cpp <<'EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <atomic>

          #define LOG_TAG "ZBR_ENGINE"

          #define LOGI(...) \
              __android_log_print(
                  ANDROID_LOG_INFO,
                  LOG_TAG,
                  __VA_ARGS__
              )

          namespace zbr {

          class Engine {
          public:

              void start() {
                  running.store(true);
                  LOGI("Zombie Battle Royale Engine started");
              }

              void stop() {
                  running.store(false);
                  LOGI("Zombie Battle Royale Engine stopped");
              }

              bool isRunning() const {
                  return running.load();
              }

          private:

              std::atomic<bool> running{false};
          };

          static Engine engine;

          }

          extern "C"
          JNIEXPORT void JNICALL
          Java_com_zbr_game_MainActivity_nativeStart(
              JNIEnv*,
              jobject) {

              zbr::engine.start();
          }

          extern "C"
          JNIEXPORT void JNICALL
          Java_com_zbr_game_MainActivity_nativeStop(
              JNIEnv*,
              jobject) {

              zbr::engine.stop();
          }

          extern "C"
          JNIEXPORT jboolean JNICALL
          Java_com_zbr_game_MainActivity_nativeIsRunning(
              JNIEnv*,
              jobject) {

              return zbr::engine.isRunning()
                  ? JNI_TRUE
                  : JNI_FALSE;
          }
          EOF

      # ========================================================
      # ANDROID JNI CMAKE
      # ========================================================

      - name: Generate Android CMake
        shell: bash
        run: |
          set -eux

          cat > android/app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)

          project(ZombieBattleRoyaleAndroid)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          set(ENGINE_DIR
              ${CMAKE_CURRENT_LIST_DIR}/../../../../../engine
          )

          add_library(
              zbr_engine
              SHARED
              ${ENGINE_DIR}/src/Engine.cpp
          )

          target_include_directories(
              zbr_engine
              PRIVATE
              ${ENGINE_DIR}/include
          )

          find_library(
              log-lib
              log
          )

          find_library(
              android-lib
              android
          )

          target_link_libraries(
              zbr_engine
              ${log-lib}
              ${android-lib}
          )
          EOF

      # ========================================================
      # ANDROID ACTIVITY
      # ========================================================

      - name: Generate MainActivity.java
        shell: bash
        run: |
          set -eux

          cat > android/app/src/main/java/com/zbr/game/MainActivity.java <<'EOF'
          package com.zbr.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.view.Gravity;

          public class MainActivity extends Activity {

              static {
                  System.loadLibrary("zbr_engine");
              }

              private native void nativeStart();

              private native void nativeStop();

              private native boolean nativeIsRunning();

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  getWindow().setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  nativeStart();

                  TextView view = new TextView(this);

                  view.setText(
                      "ZOMBIE BATTLE ROYALE\\n\\n" +
                      "C++ ENGINE ONLINE\\n" +
                      "ARM64 • ANDROID\\n\\n" +
                      "Custom Engine + Lua"
                  );

                  view.setTextColor(Color.WHITE);

                  view.setTextSize(22);

                  view.setGravity(Gravity.CENTER);

                  view.setBackgroundColor(Color.BLACK);

                  setContentView(view);
              }

              @Override
              protected void onDestroy() {
                  nativeStop();

                  super.onDestroy();
              }
          }
          EOF

      # ========================================================
      # LUA
      # ========================================================

      - name: Generate Lua gameplay scripts
        shell: bash
        run: |
          set -eux

          cat > game/scripts/game.lua <<'EOF'
          local Game = {}

          Game.name = "Zombie Battle Royale"

          Game.maxPlayers = 30

          Game.zombieEnabled = true

          Game.startMatch = function()
              print("Match started")
              print("Players: " .. Game.maxPlayers)
              print("Zombie system: enabled")
          end

          Game.startMatch()

          return Game
          EOF

          cat > game/scripts/weapons.lua <<'EOF'
          local Weapons = {}

          Weapons.assault_rifle = {
              damage = 32,
              magazine = 30,
              recoil = 1.0
          }

          Weapons.shotgun = {
              damage = 80,
              magazine = 8,
              recoil = 2.5
          }

          return Weapons
          EOF

          cat > game/scripts/zombies.lua <<'EOF'
          local Zombies = {}

          Zombies.maxAlive = 100

          Zombies.spawn = function(x, y, z)
              return {
                  x = x,
                  y = y,
                  z = z,
                  health = 100
              }
          end

          return Zombies
          EOF

      # ========================================================
      # GRADLE WRAPPER / DISTRIBUTION
      # ========================================================

      - name: Install Gradle
        shell: bash
        run: |
          set -eux

          mkdir -p "$HOME/.gradle/wrapper/dists"

          if ! command -v gradle >/dev/null 2>&1; then

            curl -fL \
              --retry 5 \
              --retry-all-errors \
              -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

            sudo unzip -q \
              /tmp/gradle.zip \
              -d /opt

            sudo ln -sf \
              "/opt/gradle-${GRADLE_VERSION}/bin/gradle" \
              /usr/local/bin/gradle

          fi

          gradle --version

      # ========================================================
      # LUA INSTALL
      # ========================================================

      - name: Install Lua
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            lua5.4 \
            ninja-build

          lua5.4 -v

      # ========================================================
      # UPLOAD PREPARED PROJECT
      # ========================================================

      - name: Upload prepared project
        uses: actions/upload-artifact@v7
        with:
          name: prepared-zombie-project
          path: |
            android/**
            engine/**
            game/**
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
          if-no-files-found: error
          retention-days: 1


  # ============================================================
  # 2. BUILD
  # ============================================================

  build:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest
    needs: prepare

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download prepared project
        uses: actions/download-artifact@v8
        with:
          name: prepared-zombie-project
          path: .

      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------------
      # Android SDK
      # --------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -eux

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          yes | sdkmanager --licenses >/dev/null || true

      # --------------------------------------------------------
      # Environment
      # --------------------------------------------------------

      - name: Configure Android environment
        shell: bash
        run: |
          set -eux

          export NDK_PATH="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          test -d "$NDK_PATH"

          test -d \
            "${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}"

          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

          echo \
            "${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin" \
            >> "$GITHUB_PATH"

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "NDK:"
          echo "$NDK_PATH"

          echo "CMake:"
          cmake --version

      # --------------------------------------------------------
      # Validate Lua
      # --------------------------------------------------------

      - name: Validate Lua
        shell: bash
        run: |
          set -eux

          find game/scripts \
            -type f \
            -name "*.lua" \
            -print0 |
          while IFS= read -r -d '' file; do

              echo "Checking Lua:"
              echo "$file"

              lua5.4 \
                -e "assert(loadfile('$file'))"

          done

          echo "Lua validation: PASS"

      # --------------------------------------------------------
      # Check project
      # --------------------------------------------------------

      - name: Validate Android project
        shell: bash
        run: |
          set -eux

          test -f settings.gradle.kts

          test -f build.gradle.kts

          test -f gradle.properties

          test -f android/app/build.gradle.kts

          test -f android/app/src/main/AndroidManifest.xml

          test -f \
            android/app/src/main/java/com/zbr/game/MainActivity.java

          test -f \
            android/app/src/main/cpp/CMakeLists.txt

          test -f engine/src/Engine.cpp

          test -d game

          echo "Android project validation: PASS"

      # --------------------------------------------------------
      # Build native engine test
      # --------------------------------------------------------

      - name: Configure native engine
        shell: bash
        run: |
          set -eux

          rm -rf build/native

          cmake \
            -S engine \
            -B build/native \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${MIN_SDK}" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: Build native engine test
        shell: bash
        run: |
          set -eux

          cmake \
            --build build/native \
            --config "${BUILD_TYPE}" \
            --parallel "$(nproc)"

          echo
          echo "Native output:"

          find build/native \
            -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

      # --------------------------------------------------------
      # Android build
      # --------------------------------------------------------

      - name: Build Release APK
        shell: bash
        run: |
          set -eux

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleRelease

      # --------------------------------------------------------
      # APK check
      # --------------------------------------------------------

      - name: Find APK
        shell: bash
        run: |
          set -eux

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -lt 1 ]; then

              echo "::error::APK was not generated"

              exit 1

          fi

          echo
          echo "APK COUNT:"
          echo "$APK_COUNT"

      - name: Check APK
        shell: bash
        run: |
          set -eux

          APK=$(find android \
            -type f \
            -name "*release*.apk" \
            | head -1)

          test -n "$APK"

          echo "APK:"
          echo "$APK"

          ls -lh "$APK"

          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            apk summary \
            "$APK" || true

      # --------------------------------------------------------
      # Copy final APK
      # --------------------------------------------------------

      - name: Prepare final APK
        shell: bash
        run: |
          set -eux

          mkdir -p release

          APK=$(find android \
            -type f \
            -name "*release*.apk" \
            | head -1)

          test -n "$APK"

          cp "$APK" \
            "release/ZombieBattleRoyale-arm64-release.apk"

          echo
          echo "FINAL APK:"
          ls -lh release/

      # --------------------------------------------------------
      # Upload
      # --------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ZombieBattleRoyale-Android-ARM64
          path: release/ZombieBattleRoyale-arm64-release.apk
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------------
      # Report
      # --------------------------------------------------------

      - name: Build report
        if: always()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " ZOMBIE BATTLE ROYALE BUILD REPORT"
          echo "=============================================="
          echo
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "NDK         : ${NDK_VERSION}"
          echo "CMake       : ${CMAKE_VERSION}"
          echo "ABI         : ${ANDROID_ABI}"
          echo "Min SDK     : ${MIN_SDK}"
          echo "Target SDK  : ${TARGET_SDK}"
          echo "Build       : ${BUILD_TYPE}"
          echo
          echo "Disk:"
          df -h
          echo
          echo "APK:"
          ls -lh release/ 2>/dev/null || true
          echo
          echo "=============================================="