name: Build and Release CorePatch PAK & Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install System Utilities (Lua 5.4, jq, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 jq curl coreutils

      # =========================================================================
      # 1. GENERATE CONTENT STRUCTURE (CorePatch Assets & Scripts)
      # =========================================================================
      - name: Scaffold CorePatch Content Files
        run: |
          mkdir -p content/scripts
          mkdir -p content/languages
          mkdir -p content/audio
          mkdir -p content/images/salah
          mkdir -p content/images/wudhu
          mkdir -p dist

          # data.json agar repo me na ho to create karega
          if [ ! -f "content/data.json" ]; then
            cat << 'EOF' > content/data.json
          {
            "patch_name": "CorePatch",
            "version": "0.0.15.0",
            "content_version": 150,
            "assets": {
              "images": [
                {
                  "name": "takbir.webp",
                  "path": "images/salah/takbir.webp",
                  "url": "https://raw.githubusercontent.com/google/material-design-icons/master/png/action/accessibility/materialicons/48dp/1x/baseline_accessibility_black_48dp.png"
                },
                {
                  "name": "ruku.webp",
                  "path": "images/salah/ruku.webp",
                  "url": "https://raw.githubusercontent.com/google/material-design-icons/master/png/action/done/materialicons/48dp/1x/baseline_done_black_48dp.png"
                },
                {
                  "name": "step1.webp",
                  "path": "images/wudhu/step1.webp",
                  "url": "https://raw.githubusercontent.com/google/material-design-icons/master/png/action/check_circle/materialicons/48dp/1x/baseline_check_circle_black_48dp.png"
                }
              ]
            }
          }
          EOF
          fi

          if [ ! -f "content/scripts/salah.lua" ]; then
            cat << 'EOF' > content/scripts/salah.lua
          local currentStep = 1
          function onInit()
              Bridge:log("CorePatch Salah Lua Controller Loaded")
          end
          function nextStep()
              currentStep = currentStep + 1
              return currentStep
          end
          EOF
          fi

          if [ ! -f "content/languages/en.json" ]; then
            cat << 'EOF' > content/languages/en.json
          {
            "appName": "Islamic Assistant",
            "salahGuide": "Salah Guide",
            "wudhuGuide": "Wudhu Guide"
          }
          EOF
          fi

          if [ ! -f "content/languages/hi.json" ]; then
            cat << 'EOF' > content/languages/hi.json
          {
            "appName": "इस्लामिक साथी",
            "salahGuide": "नमाज़ गाइड",
            "wudhuGuide": "वुज़ू गाइड"
          }
          EOF
          fi

          if [ ! -f "content/audio/takbir.ogg" ]; then
            echo "OGG_AUDIO_STREAM_PLACEHOLDER" > content/audio/takbir.ogg
          fi

      # =========================================================================
      # 2. DOWNLOAD IMAGES DEFINED IN DATA.JSON & COMPILE PAK USING LUA
      # =========================================================================
      - name: Fetch Remote Images & Compile CorePatch_0.0.15.0.pak
        run: |
          mkdir -p staging
          cp -r content/* staging/

          echo "--> Downloading assets defined in data.json..."
          jq -c '.assets.images[]' staging/data.json | while read -r item; do
            URL=$(echo "$item" | jq -r '.url')
            DEST_PATH=$(echo "$item" | jq -r '.path')
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              TARGET_DIR="staging/$(dirname "$DEST_PATH")"
              mkdir -p "$TARGET_DIR"
              curl -fsSL --retry 3 "$URL" -o "staging/$DEST_PATH" || {
                echo "Warning: Failed to fetch $URL, generating placeholder"
                echo "WEBP_IMAGE_DUMMY_PAYLOAD" > "staging/$DEST_PATH"
              }
            fi
          done

          # Inline Lua 5.4 Binary PAK Builder
          cat << 'EOF' > pak_compiler.lua
          local MAGIC = "ISPK"
          local FORMAT_VERSION = 1
          local HEADER_SIZE = 64

          local function detect_content_type(path)
              local ext = path:match("%.([%w_]+)$")
              if ext then ext = ext:lower() end
              if ext == "json" then return 1
              elseif ext == "txt" then return 2
              elseif ext == "lua" then return 3
              elseif ext == "webp" or ext == "png" or ext == "jpg" then return 4
              elseif ext == "ogg" or ext == "mp3" then return 5
              elseif ext == "ttf" or ext == "otf" then return 6
              else return 0 end
          end

          local function get_file_sha256(filepath)
              local handle = io.popen(string.format("sha256sum %q", filepath))
              local result = handle:read("*a")
              handle:close()
              local hex = result:match("(%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x)")
              if not hex then error("SHA256 failed on " .. filepath) end
              local raw = (hex:gsub("..", function(cc) return string.char(tonumber(cc, 16)) end))
              return raw, hex
          end

          local function scan_dir(dir)
              local handle = io.popen(string.format("find %q -type f | sort", dir))
              local files = {}
              local prefix = dir:gsub("/+$", "") .. "/"
              for line in handle:lines() do
                  local rel_path = line:sub(#prefix + 1):gsub("\\", "/"):gsub("^/+", "")
                  if not rel_path:find("%.tmp") then
                      table.insert(files, { full = line, rel = rel_path })
                  end
              end
              handle:close()
              return files
          end

          local input_dir, output_pak, content_ver = arg[1], arg[2], tonumber(arg[3]) or 150
          local files = scan_dir(input_dir)
          print(string.format("--> Compiling %d entries into %s", #files, output_pak))

          local temp_data = output_pak .. ".tmp.payload"
          local f_data = io.open(temp_data, "wb")
          local entries, current_offset = {}, HEADER_SIZE

          for _, item in ipairs(files) do
              local f_in = io.open(item.full, "rb")
              local content = f_in:read("*a")
              f_in:close()

              local size = #content
              local ctype = detect_content_type(item.rel)
              local sha_raw = get_file_sha256(item.full)

              f_data:write(content)
              table.insert(entries, {
                  path = item.rel, ctype = ctype, offset = current_offset,
                  size = size, comp_type = 0, sha256 = sha_raw
              })
              current_offset = current_offset + size
          end
          f_data:close()

          local temp_idx = output_pak .. ".tmp.idx"
          local f_idx = io.open(temp_idx, "wb")
          for _, e in ipairs(entries) do
              f_idx:write(string.pack(">I2", #e.path))
              f_idx:write(e.path)
              f_idx:write(string.pack(">B I8 I8 I8 B c32", e.ctype, e.offset, e.size, e.size, e.comp_type, e.sha256))
          end
          f_idx:close()

          local f_idx_r = io.open(temp_idx, "rb")
          local idx_bytes = f_idx_r:read("*a")
          f_idx_r:close()
          local idx_sha = get_file_sha256(temp_idx)

          local header = string.pack(">c4 I2 I2 I4 I4 I8 I8 c32",
              MAGIC, FORMAT_VERSION, 0, content_ver, #entries, current_offset, #idx_bytes, idx_sha
          )

          local f_out = io.open(output_pak, "wb")
          f_out:write(header)
          local f_p = io.open(temp_data, "rb")
          while true do
              local chunk = f_p:read(65536)
              if not chunk then break end
              f_out:write(chunk)
          end
          f_p:close()
          f_out:write(idx_bytes)
          f_out:close()

          os.remove(temp_data)
          os.remove(temp_idx)
          print("[SUCCESS] PAK Created: " .. output_pak)
          EOF

          # Compile CorePatch
          lua5.4 pak_compiler.lua staging dist/CorePatch_0.0.15.0.pak 150

          # Generate Manifest and SHA256SUMS
          cd dist
          sha256sum CorePatch_0.0.15.0.pak > SHA256SUMS
          HASH=$(awk '{print $1}' SHA256SUMS)
          SIZE=$(stat -c%s CorePatch_0.0.15.0.pak)

          cat << EOF > manifest.json
          {
            "version": 150,
            "patch_name": "CorePatch_0.0.15.0",
            "packages": [
              {
                "id": "core_patch",
                "version": 150,
                "file_name": "CorePatch_0.0.15.0.pak",
                "size": $SIZE,
                "sha256": "$HASH"
              }
            ]
          }
          EOF
          cd ..

      # =========================================================================
      # 3. SCAFFOLD ANDROID JETPACK COMPOSE PROJECT STRUCTURE
      # =========================================================================
      - name: Scaffold Complete Android App Structure
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/islamic/app/ui/theme
          mkdir -p app/src/main/java/com/islamic/app/ui/components
          mkdir -p app/src/main/java/com/islamic/app/ui/screens
          mkdir -p app/src/main/java/com/islamic/app/pak
          mkdir -p app/src/main/java/com/islamic/app/downloader

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IslamicApp"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.islamic.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.islamic.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 150
                  versionName = "0.0.15.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      isDebuggable = true
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")

              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3:1.3.1")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("org.luaj:luaj-jse:3.0.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.json:json:20240303")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Islamic App"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Islamic App</string>
          </resources>
          EOF

          # UI Theme Colors
          cat << 'EOF' > app/src/main/java/com/islamic/app/ui/theme/Color.kt
          package com.islamic.app.ui.theme

          import androidx.compose.ui.graphics.Color

          val DarkOledBlack = Color(0xFF0C100E)
          val DarkSurfaceCard = Color(0xFF141C18)
          val DarkCardBorder = Color(0xFF22302A)
          val DarkActiveBadge = Color(0xFFE65100)
          val DarkActiveBadgeBg = Color(0xFF331B0E)
          val EmeraldPrimary = Color(0xFF22C55E)
          val MintSecondary = Color(0xFF4ADE80)
          val SoftIllustrationBg = Color(0xFF88A08E)
          val TextPureWhite = Color(0xFFF1F5F3)
          val TextMuted = Color(0xFF8FA89B)
          EOF

          # UI Theme
          cat << 'EOF' > app/src/main/java/com/islamic/app/ui/theme/Theme.kt
          package com.islamic.app.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable

          private val DarkColorScheme = darkColorScheme(
              primary = EmeraldPrimary,
              secondary = MintSecondary,
              background = DarkOledBlack,
              surface = DarkSurfaceCard,
              onPrimary = DarkOledBlack,
