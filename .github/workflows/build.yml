              "app/src/main/java/com/muslimcommunity/app/NativeCore.kt": """
          package com.muslimcommunity.app

          object NativeCore {
              init {
                  System.loadLibrary("native-lib")
              }
              external fun verifyWasmMagic(bytes: ByteArray): Boolean
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/WasmSyncManager.kt": """
          package com.muslimcommunity.app

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.File
          import java.io.FileOutputStream
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          data class DailyAyahPost(
              val id: Int,
              val surahName: String,
              val ayahNo: Int,
              val tag: String,
              val arabic: String,
              val translation: String,
              val tafseer: String
          )

          object WasmSyncManager {
              private const val GITHUB_JSON_URL = "https://raw.githubusercontent.com/bindassrkks-cell/Lua/main/wasm/muslim_feed.json"
              private const val PREFS_NAME = "wasm_sync_prefs"

              var dailyBannerArabic: String = "إِنَّ مَعَ الْعُسْرِ يُسْرًا"
              var dailyBannerTrans: String = "Indeed, with hardship comes ease."
              var dailyBannerSurah: String = "Surah Ash-Sharh (94:6)"
              var ayahPosts = mutableListOf<DailyAyahPost>()
              var lastSyncTime: String = "Embedded Assets"
              var isWasmVerified: Boolean = false

              fun init(context: Context) {
                  try {
                      val localCache = File(context.filesDir, "synced_feed.json")
                      val jsonStr = if (localCache.exists()) {
                          localCache.readText(Charsets.UTF_8)
                      } else {
                          // Read from packed muslim_core.wasm in assets
                          val wasmStream = context.assets.open("muslim_core.wasm")
                          val bytes = wasmStream.readBytes()
                          wasmStream.close()
                          isWasmVerified = NativeCore.verifyWasmMagic(bytes)

                          val raw = String(bytes, Charsets.ISO_8859_1)
                          val jsonStart = raw.indexOf("{\"repo\"")
                          if (jsonStart != -1) {
                              raw.substring(jsonStart).trim()
                          } else {
                              ""
                          }
                      }

                      if (jsonStr.isNotBlank()) {
                          parseFeed(jsonStr)
                      } else {
                          loadFallback()
                      }
                  } catch (e: Exception) {
                      loadFallback()
                  }
              }

              private fun parseFeed(jsonStr: String) {
                  val root = JSONObject(jsonStr)
                  lastSyncTime = root.optString("last_sync", "Local")
                  val banner = root.optJSONObject("daily_banner")
                  if (banner != null) {
                      dailyBannerArabic = banner.optString("arabic", dailyBannerArabic)
                      dailyBannerTrans = banner.optString("translation", dailyBannerTrans)
                      dailyBannerSurah = banner.optString("surah", dailyBannerSurah)
                  }

                  val arr = root.optJSONArray("ayat_posts")
                  if (arr != null) {
                      ayahPosts.clear()
                      for (i in 0 until arr.length()) {
                          val item = arr.getJSONObject(i)
                          ayahPosts.add(DailyAyahPost(
                              item.getInt("id"),
                              item.getString("surah_name"),
                              item.getInt("ayah_no"),
                              item.getString("tag"),
                              item.getString("arabic"),
                              item.getString("translation"),
                              item.getString("tafseer")
                          ))
                      }
                  }
              }

              suspend fun syncWithGitHub(context: Context): Boolean = withContext(Dispatchers.IO) {
                  try {
                      val url = URL(GITHUB_JSON_URL)
                      val conn = url.openConnection() as HttpURLConnection
                      conn.connectTimeout = 7000
                      conn.readTimeout = 7000

                      if (conn.responseCode == 200) {
                          val reader = BufferedReader(InputStreamReader(conn.inputStream))
                          val content = reader.readText()
                          parseFeed(content)

                          val cache = File(context.filesDir, "synced_feed.json")
                          FileOutputStream(cache).use { out ->
                              out.write(content.toByteArray(Charsets.UTF_8))
                          }
                          true
                      } else {
                          false
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun loadFallback() {
                  ayahPosts.clear()
                  ayahPosts.add(DailyAyahPost(
                      1, "Al-Baqarah", 153, "Patience",
                      "يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ",
                      "O you who have believed, seek help through patience and prayer. Indeed, Allah is with the patient.",
                      "Patience and Prayer are the two pillars of serenity in Islam."
                  ))
              }
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/QuranRepository.kt": """
          package com.muslimcommunity.app

          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          data class Surah(val number: Int, val name: String, val englishName: String, val verses: Int)
          data class Ayah(val numberInSurah: Int, val text: String, val audioUrl: String)

          object QuranRepository {
              private var player: MediaPlayer? = null
              var activeAudioUrl: String? = null

              suspend fun getSurahs(): List<Surah> = withContext(Dispatchers.IO) {
                  val list = mutableListOf<Surah>()
                  try {
                      val url = URL("https://api.alquran.cloud/v1/surah")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.connectTimeout = 6000
                      conn.readTimeout = 6000
                      if (conn.responseCode == 200) {
                          val json = JSONObject(BufferedReader(InputStreamReader(conn.inputStream)).readText())
                          val data = json.getJSONArray("data")
                          for (i in 0 until data.length()) {
                              val item = data.getJSONObject(i)
                              list.add(Surah(item.getInt("number"), item.getString("name"), item.getString("englishName"), item.getInt("numberOfAyahs")))
                          }
                      }
                  } catch (e: Exception) {
                      list.addAll(listOf(
                          Surah(1, "الفَاتِحة", "Al-Fatihah", 7),
                          Surah(2, "البَقَرَة", "Al-Baqarah", 286),
                          Surah(36, "يس", "Ya-Sin", 83),
                          Surah(55, "الرَّحْمَٰن", "Ar-Rahman", 78),
                          Surah(67, "المُلْك", "Al-Mulk", 30),
                          Surah(112, "الإِخْلَاص", "Al-Ikhlas", 4)
                      ))
                  }
                  list
              }

              suspend fun getSurahAyahs(surahNumber: Int): List<Ayah> = withContext(Dispatchers.IO) {
                  val list = mutableListOf<Ayah>()
                  try {
                      val url = URL("https://api.alquran.cloud/v1/surah/$surahNumber/ar.alafasy")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.connectTimeout = 8000
                      conn.readTimeout = 8000
                      if (conn.responseCode == 200) {
                          val json = JSONObject(BufferedReader(InputStreamReader(conn.inputStream)).readText())
                          val ayahs = json.getJSONObject("data").getJSONArray("ayahs")
                          for (i in 0 until ayahs.length()) {
                              val item = ayahs.getJSONObject(i)
                              list.add(Ayah(item.getInt("numberInSurah"), item.getString("text"), item.optString("audio", "")))
                          }
                      }
                  } catch (e: Exception) {
                      list.add(Ayah(1, "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", ""))
                      list.add(Ayah(2, "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", ""))
                  }
                  list
              }

              fun playAudio(url: String, onFinish: () -> Unit) {
                  stopAudio()
                  if (url.isBlank()) return
                  try {
                      player = MediaPlayer().apply {
                          setAudioAttributes(AudioAttributes.Builder().setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).setUsage(AudioAttributes.USAGE_MEDIA).build())
                          setDataSource(url)
                          prepareAsync()
                          setOnPreparedListener {
                              activeAudioUrl = url
                              start()
                          }
                          setOnCompletionListener {
                              activeAudioUrl = null
                              onFinish()
                          }
                      }
                  } catch (e: Exception) {
                      activeAudioUrl = null
                  }
              }

              fun stopAudio() {
                  player?.stop()
                  player?.release()
                  player = null
                  activeAudioUrl = null
              }
          }
          """.strip(),

              "app/src/main/java/com/muslimcommunity/app/MainActivity.kt": """
          package com.muslimcommunity.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.launch

          enum class AppScreen { Home, Ayat, Quran, Prayer, Settings, AyahDetail, SurahDetail }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WasmSyncManager.init(this)
                  setContent {
                      MuslimApp()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  QuranRepository.stopAudio()
              }
          }

          @Composable
          fun MuslimApp() {
              var currentScreen by remember { mutableStateOf(AppScreen.Home) }
              var activeAyah by remember { mutableStateOf<DailyAyahPost?>(null) }
              var activeSurah by remember { mutableStateOf<Surah?>(null) }

              MaterialTheme(colorScheme = darkColorScheme(
                  primary = Color(0xFF10B981),
                  background = Color(0xFF070A11),
                  surface = Color(0xFF101726)
              )) {
                  Scaffold(
                      topBar = {
                          IosHeader(
                              title = when (currentScreen) {
                                  AppScreen.Ayat -> "Daily Ayat & Reflections"
                                  AppScreen.AyahDetail -> "Ayah Insight"
                                  AppScreen.Quran -> "Holy Quran"
                                  AppScreen.SurahDetail -> (activeSurah?.englishName ?: "Surah")
                                  AppScreen.Prayer -> "Prayer Schedule"
                                  AppScreen.Settings -> "WASM Plugin & Settings"
                                  else -> "Muslim Community"
                              },
                              showBack = currentScreen in listOf(AppScreen.Settings, AppScreen.AyahDetail, AppScreen.SurahDetail),
                              onBack = { currentScreen = AppScreen.Home },
                              onOpenSettings = { currentScreen = AppScreen.Settings },
                              isSettings = currentScreen == AppScreen.Settings
                          )
                      },
                      bottomBar = {
                          if (currentScreen !in listOf(AppScreen.Settings, AppScreen.AyahDetail, AppScreen.SurahDetail)) {
                              IosNavBar(currentScreen) { currentScreen = it }
                          }
                      }
                  ) { padding ->
                      Box(modifier = Modifier.padding(padding).fillMaxSize().background(Color(0xFF070A11))) {
                          when (currentScreen) {
                              AppScreen.Home -> HomeScreen(
                                  onOpenAyat = { currentScreen = AppScreen.Ayat },
                                  onSelectAyah = { ayah ->
                                      activeAyah = ayah
                                      currentScreen = AppScreen.AyahDetail
                                  }
                              )
                              AppScreen.Ayat -> AyatFeedScreen(onSelect = {
                                  activeAyah = it
                                  currentScreen = AppScreen.AyahDetail
                              })
                              AppScreen.AyahDetail -> activeAyah?.let { AyahDetailScreen(it) }
                              AppScreen.Quran -> QuranScreen(onSelect = {
                                  activeSurah = it
                                  currentScreen = AppScreen.SurahDetail
                              })
                              AppScreen.SurahDetail -> activeSurah?.let { SurahDetailScreen(it) }
                              AppScreen.Prayer -> PrayerScreen()
                              AppScreen.Settings -> SettingsWasmScreen()
                          }
                      }
                  }
              }
          }

          @Composable
          fun IosHeader(title: String, showBack: Boolean, onBack: () -> Unit, onOpenSettings: () -> Unit, isSettings: Boolean) {
              Surface(
                  color = Color(0xFF0E1626).copy(alpha = 0.96f),
                  border = BorderStroke(1.dp, Color.White.copy(alpha = 0.06f))
              ) {
                  Row(
