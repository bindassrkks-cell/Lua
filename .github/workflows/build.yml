name: Muslim Community - AI Generate Build Push

on:
  workflow_dispatch:
    inputs:
      clean_repo:
        description: "Delete existing project files and generate a new project"
        required: true
        default: true
        type: boolean
      push_project:
        description: "Push generated project back to repository"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  COMPILE_SDK: "35"
  TARGET_SDK: "35"
  MIN_SDK: "24"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "26.3.11579264"
  CMAKE_VERSION: "3.22.1"
  GEMINI_MODEL: "gemini-2.5-flash"

jobs:
  muslim-community:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. GIT CONFIG
      # ============================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 3. CHECK GEMINI KEY
      # ============================================================
      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY secret is missing in repository settings."
            exit 1
          fi
          echo "Gemini API key is available."

      # ============================================================
      # 4. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip git zip python3

      # ============================================================
      # 5. BACKUP CURRENT REPOSITORY
      # ============================================================
      - name: Create backup branch
        if: ${{ inputs.clean_repo == true }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_BRANCH="${GITHUB_REF_NAME}"
          BACKUP_BRANCH="backup-muslim-ai-${GITHUB_RUN_ID}"
          git checkout -b "${BACKUP_BRANCH}"
          git push origin "${BACKUP_BRANCH}" || true
          git checkout "${CURRENT_BRANCH}"

      # ============================================================
      # 6. GENERATE PROJECT WITH GEMINI
      # ============================================================
      - name: Generate Muslim Community project
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/gemini_request.json <<'JSON'
          {
            "contents": [
              {
                "role": "user",
                "parts": [
                  {
                    "text": "Generate a completely compilable, standalone Android application project called MuslimCommunity. Package: com.muslimcommunity.app. Language: Kotlin, Jetpack Compose (Material 3), Java 17, compileSdk 35, targetSdk 35, minSdk 24, CMake 3.22.1, NDK JNI C++. Include onboarding, home dashboard, Quran, Hadith, prayer times, Qibla compass layout, Supabase client configuration placeholder. IMPORTANT FOR COMPILATION: In app/build.gradle.kts set signingConfigs { getByName(\"release\") { signingConfig = signingConfigs.getByName(\"debug\") } } so assembleRelease succeeds. Provide all required files: settings.gradle.kts, root build.gradle.kts, app/build.gradle.kts, gradle.properties, AndroidManifest.xml, MainActivity.kt, native-lib.cpp, CMakeLists.txt, res/values/strings.xml, colors.xml, themes.xml. Return ONLY valid JSON format: {\"files\": [{\"path\": \"relative/path\", \"content\": \"code\"}]}. Do NOT include markdown blocks."
                  }
                ]
              }
            ],
            "generationConfig": {
              "temperature": 0.1,
              "maxOutputTokens": 65536,
              "responseMimeType": "application/json"
            }
          }
          JSON

          echo "Calling Gemini model: ${GEMINI_MODEL}..."
          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/gemini_response.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/gemini_request.json)

          if [ "${HTTP_CODE}" -ne 200 ]; then
            echo "::error::Gemini API failed with HTTP ${HTTP_CODE}."
            cat /tmp/gemini_response.json
            exit 1
          fi

          python3 - <<'PY'
          import json, re

          with open("/tmp/gemini_response.json", "r", encoding="utf-8") as f:
              res = json.load(f)

          parts = res.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          if not parts:
              raise SystemExit("No content generated by Gemini.")

          raw_text = "".join([p.get("text", "") for p in parts]).strip()
          # Strip accidental markdown code blocks
          raw_text = re.sub(r"^```json\s*", "", raw_text)
          raw_text = re.sub(r"^```\s*", "", raw_text)
          raw_text = re.sub(r"\s*```$", "", raw_text)

          start = raw_text.find("{")
          end = raw_text.rfind("}")
          if start == -1 or end == -1:
              raise SystemExit("Valid JSON not found in response.")

          parsed = json.loads(raw_text[start:end+1])
          if "files" not in parsed or not isinstance(parsed["files"], list):
              raise SystemExit("Generated payload missing 'files' list.")

          with open("/tmp/project.json", "w", encoding="utf-8") as f:
              json.dump(parsed, f, ensure_ascii=False)

          print(f"Extracted {len(parsed['files'])} files.")
          PY

      # ============================================================
      # 7. CLEAN EXISTING PROJECT FILES
      # ============================================================
      - name: Clean existing repository
        if: ${{ inputs.clean_repo == true }}
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          echo "Cleaned existing working tree."

      # ============================================================
      # 8. WRITE GENERATED FILES
      # ============================================================
      - name: Write project files
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os

          with open("/tmp/project.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for f in data.get("files", []):
              rel_path = f["path"].lstrip("/").replace("\\", "/")
              if ".." in rel_path:
                  continue
              os.makedirs(os.path.dirname(rel_path), exist_ok=True)
              with open(rel_path, "w", encoding="utf-8") as out:
                  out.write(f["content"])
              print(f"Wrote: {rel_path}")
          PY

      # ============================================================
      # 9. JAVA 17 SETUP
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================================
      # 10. ANDROID SDK & NDK SETUP
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"

      # ============================================================
      # 11. CONFIGURE LOCAL.PROPERTIES
      # ============================================================
      - name: Configure local.properties
        run: |
          cat > local.properties <<EOF ! "${GITHUB_REF_NAME}" "./gradlew" "Generate "Installing "No #="===========================================================" $\rightarrow$ ${{ & && (AAB) (Google * **Actions** **General** **Read **Required **Secrets **Settings** **Workflow **`GEMINI_API_KEY`** +x - --cached --gradle-version --no-daemon --quiet; --version -A -d -f -m -q -rf -sLo ./gradlew /tmp/ /tmp/gradle-8.10.2 /tmp/gradle-8.10.2/bin/gradle /tmp/gradle.zip 12. 13. 14. 15. 16. 17. 8.10.2 AAB AI APK ARTIFACT Android BUILD BUNDLE Build COMMIT Community DEBUG Debug EOF Ensure GRADLE Gradle Muslim MuslimCommunity-debug-apk MuslimCommunity-release-aab MuslimCommunity-release-apk PUSH Push RELEASE REPO Release Repository SETUP SUPABASE_ANON_KEY: SUPABASE_URL: Setup:** Studio TO UPLOADS Upload WRAPPER [ [skip ]; ``` actions/upload-artifact@v4 add always() and app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab assembleDebug assembleRelease bash bundleRelease changes chmod ci]" commit commit." curl define diff echo else enable env: exists fi files generate generated git ho https://services.gradle.org/distributions/gradle-8.10.2-bin.zip if if-no-files-found: if: ignore inputs.push_project="=" jakar karein karke). me name: ndk.dir="${ANDROID_HOME}/ndk/${NDK_VERSION}" origin path: permissions** project push repository rm run: sakein. sdk.dir="${ANDROID_HOME}" se secrets.SUPABASE_ANON_KEY secrets.SUPABASE_URL shell: standalone success() taki then to true unzip uses: variables** verified with: wrapper wrapper..." write | }}>
