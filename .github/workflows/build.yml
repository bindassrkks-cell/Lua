            echo "SUCCESS: Code pushed to main branch."
          else
            echo "Working tree is clean."
          fi

      # =========================================================================
      # 3. COMPILE STANDALONE libsos.so FOR GITHUB RELEASES OTA DOWNLOAD
      # =========================================================================
      - name: Compile Standalone libsos.so via NDK Clang
        run: |
          mkdir -p dist
          NDK_TOOLCHAIN="${ANDROID_HOME}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin"
          $NDK_TOOLCHAIN/aarch64-linux-android24-clang -shared -fPIC -O3 \
            app/src/main/cpp/libsos.c -o dist/libsos.so -llog
          echo "[SUCCESS] dist/libsos.so compiled"

      # =========================================================================
      # 4. BUILD COREPATCH BINARY PAK
      # =========================================================================
      - name: Build CorePatch PAK
        run: |
          mkdir -p staging dist
          cp -r content/* staging/

          jq -c '.assets.images[]' staging/data.json | while read -r item; do
            URL=$(echo "$item" | jq -r '.url')
            DEST_PATH=$(echo "$item" | jq -r '.path')
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              mkdir -p "staging/$(dirname "$DEST_PATH")"
              curl -fsSL --retry 3 "$URL" -o "staging/$DEST_PATH" || {
                printf '\x52\x49\x46\x46\x24\x00\x00\x00\x57\x45\x42\x50\x56\x50\x38\x20\x18\x00\x00\x00\x30\x01\x00\x9d\x01\x2a\x01\x00\x01\x00\x02\x00\x34\x25\xa4\x00\x03\x70\x00\xfe\xfb\xfd\x50\x00' > "staging/$DEST_PATH"
              }
            fi
          done

          cat << 'EOF' > pak_compiler.lua
          local MAGIC = "ISPK"
          local FORMAT_VERSION = 1
          local HEADER_SIZE = 64

          local function detect_content_type(path)
              local ext = path:match("%.([%w_]+)$")
              if ext then ext = ext:lower() end
              if ext == "json" then return 1
              elseif ext == "txt" then return 2
              elseif ext == "lua" then return 3
              elseif ext == "webp" or ext == "png" or ext == "jpg" then return 4
              elseif ext == "ogg" or ext == "mp3" then return 5
              elseif ext == "ttf" or ext == "otf" then return 6
              else return 0 end
          end

          local function get_file_sha256(filepath)
              local handle = io.popen(string.format("sha256sum %q", filepath))
              local result = handle:read("*a")
              handle:close()
              local hex = result:match("(%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x%x)")
              return (hex:gsub("..", function(cc) return string.char(tonumber(cc, 16)) end)), hex
          end

          local function scan_dir(dir)
              local handle = io.popen(string.format("find %q -type f | sort", dir))
              local files = {}
              local prefix = dir:gsub("/+$", "") .. "/"
              for line in handle:lines() do
                  local rel_path = line:sub(#prefix + 1):gsub("\\", "/"):gsub("^/+", "")
                  table.insert(files, { full = line, rel = rel_path })
              end
              handle:close()
              return files
          end

          local input_dir, output_pak, content_ver = arg[1], arg[2], tonumber(arg[3]) or 150
          local files = scan_dir(input_dir)

          local temp_data = output_pak .. ".tmp.payload"
          local f_data = io.open(temp_data, "wb")
          local entries, current_offset = {}, HEADER_SIZE

          for _, item in ipairs(files) do
              local f_in = io.open(item.full, "rb")
              local content = f_in:read("*a")
              f_in:close()

              local size = #content
              local ctype = detect_content_type(item.rel)
              local sha_raw = get_file_sha256(item.full)

              f_data:write(content)
              table.insert(entries, {
                  path = item.rel, ctype = ctype, offset = current_offset,
                  size = size, comp_type = 0, sha256 = sha_raw
              })
              current_offset = current_offset + size
          end
          f_data:close()

          local temp_idx = output_pak .. ".tmp.idx"
          local f_idx = io.open(temp_idx, "wb")
          for _, e in ipairs(entries) do
              f_idx:write(string.pack(">I2", #e.path))
              f_idx:write(e.path)
              f_idx:write(string.pack(">B I8 I8 I8 B c32", e.ctype, e.offset, e.size, e.size, e.comp_type, e.sha256))
          end
          f_idx:close()

          local f_idx_r = io.open(temp_idx, "rb")
          local idx_bytes = f_idx_r:read("*a")
          f_idx_r:close()
          local idx_sha = get_file_sha256(temp_idx)

          local header = string.pack(">c4 I2 I2 I4 I4 I8 I8 c32",
              MAGIC, FORMAT_VERSION, 0, content_ver, #entries, current_offset, #idx_bytes, idx_sha
          )

          local f_out = io.open(output_pak, "wb")
          f_out:write(header)
          local f_p = io.open(temp_data, "rb")
          while true do
              local chunk = f_p:read(65536)
              if not chunk then break end
              f_out:write(chunk)
          end
          f_p:close()
          f_out:write(idx_bytes)
          f_out:close()

          os.remove(temp_data)
          os.remove(temp_idx)
          print("[SUCCESS] CorePatch PAK Compiled: " .. output_pak)
          EOF

          lua5.4 pak_compiler.lua staging dist/CorePatch_0.0.15.0.pak 150

          cd dist
          sha256sum CorePatch_0.0.15.0.pak > SHA256SUMS
          sha256sum libsos.so >> SHA256SUMS
          HASH=$(awk '{print $1}' SHA256SUMS | head -n 1)
          SIZE=$(stat -c%s CorePatch_0.0.15.0.pak)

          cat << EOF > manifest.json
          {
            "version": 150,
            "patch_name": "CorePatch_0.0.15.0",
            "packages": [
              {
                "id": "core_patch",
                "version": 150,
                "file_name": "CorePatch_0.0.15.0.pak",
                "size": $SIZE,
                "sha256": "$HASH"
              }
            ]
          }
          EOF
          cd ..

      # =========================================================================
      # 5. COMPILE ANDROID DEBUG APK (WITH EMBEDDED NATIVE CMAKE BUILD)
      # =========================================================================
      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk dist/IslamicApp_0.0.15.0.apk

      # =========================================================================
      # 6. PUBLISH ARTIFACTS TO GITHUB RELEASES
      # =========================================================================
      - name: Publish CorePatch PAK, libsos.so & APK
        uses: softprops/action-gh-release@v2
        with:
          name: CorePatch & Islamic App 0.0.15.0
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.15.0' }}
          files: |
            dist/CorePatch_0.0.15.0.pak
            dist/libsos.so
            dist/SHA256SUMS
            dist/manifest.json
            dist/IslamicApp_0.0.15.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
