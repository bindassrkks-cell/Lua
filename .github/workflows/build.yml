              val mbSize = if (isInstalled) String.format("%.2f MB", file.length() / (1024.0 * 1024.0)) else "2.50 MB"

              Surface(modifier = Modifier.fillMaxSize().background(DarkOledBlack), color = DarkOledBlack) {
