      # =========================================================================
      # 2. PUSH ALL C/C++ & KOTLIN SOURCES DIRECTLY TO MAIN BRANCH FIRST
      # =========================================================================
      - name: Commit & Push Full Native Codebase
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git push origin :refs/tags/main || true

          # Purge any old tracked pak directories in git
          git rm -rf content dist staging *.pak app/src/main/java/com/islamic/app/pak 2>/dev/null || true

          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "feat: complete native C++ libsos architecture with all modules [skip ci]"
            git push origin HEAD:refs/heads/main --force
            echo "SUCCESS: Code pushed to main branch."
          else
            echo "Working tree is clean."
          fi

      # =========================================================================
      # 3. COMPILE ANDROID APK & EXTRACT 2.5 MB libsos.so
      # =========================================================================
      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IslamicApp_0.0.15.0.apk

          # Extract compiled 2.5MB libsos.so from Gradle output
          find app/build/intermediates -name "libsos.so" -path "*/arm64-v8a/*" -exec cp {} dist/libsos.so \;
          if [ ! -f dist/libsos.so ]; then
              find app/build -name "libsos.so" | head -n 1 | xargs -I {} cp {} dist/libsos.so
          fi

          ls -lh dist/libsos.so
          echo "[SUCCESS] Verified 2.5MB libsos.so and Android APK ready for release."

      # =========================================================================
      # 4. PUBLISH RELEASE ASSETS (APK & STANDALONE libsos.so)
      # =========================================================================
      - name: Publish libsos.so & APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Islamic App 0.0.15.0 (Native Core)
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.15.0' }}
          files: |
            dist/libsos.so
            dist/IslamicApp_0.0.15.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
